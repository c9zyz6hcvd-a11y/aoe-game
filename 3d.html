<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RTS 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1a1a;font-family:sans-serif;}
  #c{display:block;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #ov{position:fixed;inset:0;pointer-events:none;z-index:4;}
  @media(max-width:768px){
    #topbar{height:44px;font-size:15px;gap:18px;}
    #hud{display:none;}
    #wavebar{font-size:12px;padding:3px 12px 5px;}
    #bmenu{height:80px;gap:5px;padding:0 6px;}
    #bmenu button{font-size:13px;padding:10px 12px;border-radius:10px;min-height:52px;}
    #idleBtn{top:52px;font-size:14px;padding:8px 16px;}
    #minimap{width:130px;height:98px;bottom:88px;}
    #mobileBar{display:flex;}
  }
  #mobileBar{display:none;position:fixed;bottom:82px;left:8px;gap:8px;z-index:12;flex-direction:column;}
  #mobileBar button{background:rgba(0,0,0,.65);border:2px solid #888;color:#fff;
    font-size:20px;width:52px;height:52px;border-radius:12px;cursor:pointer;backdrop-filter:blur(4px);}
  #mobileBar button:active{background:rgba(255,210,80,.3);border-color:#ffd250;}
  #topbar{position:fixed;top:0;left:0;right:0;height:40px;background:rgba(0,0,0,.78);
    display:flex;align-items:center;justify-content:center;gap:22px;
    color:#fff;font-size:16px;font-weight:bold;pointer-events:none;border-bottom:1px solid #444;z-index:5;}
  #hud{position:fixed;top:80px;left:8px;color:#ccc;font-size:11px;
       background:rgba(0,0,0,.55);padding:5px 8px;border-radius:7px;line-height:1.8;pointer-events:none;z-index:5;}
  #idleBtn{position:fixed;top:44px;right:8px;color:#ffd250;font-size:12px;font-weight:bold;
    background:rgba(0,0,0,.6);padding:5px 12px;border-radius:20px;cursor:pointer;z-index:5;
    display:none;border:1px solid #ffd250;transition:all .15s;}
  #idleBtn:hover{background:rgba(60,50,20,.8);transform:scale(1.04);}
  #status{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    color:#ffd250;font-size:13px;font-weight:bold;pointer-events:none;
    background:rgba(0,0,0,.5);padding:4px 14px;border-radius:20px;
    opacity:0;transition:opacity .3s;z-index:10;}
  #bmenu{position:fixed;bottom:0;left:0;right:0;height:72px;
    background:rgba(12,12,12,.85);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;gap:6px;
    border-top:2px solid #555;z-index:10;padding:0 10px;
    user-select:none;}
  #bmenu button{background:rgba(55,55,55,.9);border:2px solid #666;color:#eee;
    font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;
    font-weight:bold;font-family:sans-serif;transition:all .12s;white-space:nowrap;
    pointer-events:auto;}
  #bmenu button:hover:not(:disabled){border-color:#ffd250;background:rgba(75,75,75,.9);transform:scale(1.04);}
  #bmenu button:disabled{opacity:.3;cursor:not-allowed;border-color:#444;transform:none;}
  #bmenu .label{color:#aaa;font-size:13px;padding:0 8px;font-weight:bold;}
  #bmenu .cost{color:#c8a030;font-size:10px;}
  #bmenu .costF{color:#e06060;font-size:10px;}
  #bmenu .costS{color:#888;font-size:10px;}
  .costG{color:#f4d03f;font-size:10px;}
  #minimap{position:fixed;bottom:76px;right:8px;width:180px;height:135px;
    border:2px solid #666;border-radius:6px;background:rgba(0,0,0,.45);z-index:6;
    cursor:pointer;overflow:hidden;backdrop-filter:blur(2px);}
  #grpLabels{position:fixed;bottom:0;left:8px;display:flex;gap:4px;z-index:11;padding:4px;}
  #grpLabels .gl{background:rgba(0,0,0,.6);color:#888;font-size:11px;padding:2px 6px;border-radius:4px;
    border:1px solid #444;min-width:18px;text-align:center;display:none;}
  #grpLabels .gl.has{display:block;border-color:#ffd250;color:#ffd250;}
  #wavebar{position:fixed;top:36px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.6);border-radius:0 0 8px 8px;padding:2px 14px 4px;
    color:#ff9050;font-size:11px;font-weight:bold;z-index:5;pointer-events:none;white-space:nowrap;}
  #wavebar .wbg{background:#333;border-radius:3px;height:4px;width:120px;display:inline-block;vertical-align:middle;margin:0 4px;}
  #wavebar .wfg{background:#ff7030;height:4px;border-radius:3px;transition:width .5s;}
  #aiStatus{position:fixed;top:44px;right:120px;background:rgba(0,60,120,.7);color:#80d0ff;
    font-size:11px;padding:3px 10px;border-radius:12px;z-index:5;pointer-events:none;display:none;}
  #ageBadge{transition:all .4s;cursor:default;}
  #ageUpProgress{position:fixed;top:38px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.7);border-radius:0 0 8px 8px;padding:2px 14px 4px;
    color:#ffd250;font-size:11px;font-weight:bold;z-index:5;pointer-events:none;
    white-space:nowrap;display:none;}
  #statsPanel{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;}
  #statsPanel table{border-collapse:collapse;margin:12px auto;font-size:14px;}
  #statsPanel td{padding:4px 18px;border-bottom:1px solid #333;}
  #statsPanel td:first-child{color:#aaa;text-align:right;}
  #statsPanel td:last-child{color:#ffd250;font-weight:bold;text-align:left;}
  #alert{position:fixed;inset:0;border:0px solid transparent;pointer-events:none;z-index:100;transition:border-color .15s;}
  #alert.on{border:4px solid #ff3030;border-color:#ff3030;transition:border-color 0s;}
  #alertDot{position:fixed;width:18px;height:18px;border-radius:50%;background:red;pointer-events:none;z-index:101;
    opacity:0;transform:translate(-50%,-50%);transition:opacity .2s;}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div id="topbar">
  <span>🪵<b id="wood">100</b></span>
  <span>🍓<b id="food">80</b></span>
  <span>🪨<b id="stone">0</b></span>
  <span>💰<b id="gold">0</b></span>
  <span>👥<b id="pop">3</b>/<b id="popCap">5</b></span>
  <span id="ageBadge" style="background:rgba(60,40,0,.7);padding:1px 8px;border-radius:10px;color:#ffd250;">🌑黑暗時代</span>
  <span id="timer" style="color:#ffd250;"></span>
</div>
<div id="wavebar">⚔️ 波次 <span id="waveNum">0</span> &nbsp;<span class="wbg"><span class="wfg" id="waveFg" style="width:0%"></span></span>&nbsp;<span id="waveEta">3:00</span></div>
<div id="aiStatus">🤖 AI 思考中…</div>
<div id="hud">
  框村民→蓋🏠🪨 點主堡→生村民｜點敵→攻擊<br>
  <b>A</b>全選村民 <b>B</b>蓋房 <b>Ctrl+1~9</b>編隊 <b>1~9</b>選編隊
</div>
<div id="idleBtn" onclick="gotoIdleVil()">⚠️ 閒置</div>
<div id="musicBtn" onclick="toggleMusic()" style="position:fixed;top:44px;left:8px;color:#80d0ff;font-size:12px;font-weight:bold;
  background:rgba(0,0,0,.55);padding:5px 12px;border-radius:20px;cursor:pointer;z-index:5;border:1px solid #5090c0;">🎵 音樂</div>
<div id="mpBtn" onclick="openLobby()" style="position:fixed;top:80px;right:8px;color:#80d0ff;font-size:12px;font-weight:bold;
  background:rgba(0,0,0,.6);padding:5px 12px;border-radius:20px;cursor:pointer;z-index:5;border:1px solid #4090d0;">🌐 對戰</div>
<div id="codexBtn" onclick="openCodex()" style="position:fixed;top:116px;right:8px;color:#ffd27a;font-size:12px;font-weight:bold;
  background:rgba(0,0,0,.6);padding:5px 12px;border-radius:20px;cursor:pointer;z-index:5;border:1px solid #c0902f;">📖 圖鑑</div>
<div id="codex" style="display:none;position:fixed;inset:0;background:rgba(8,10,14,.94);z-index:350;overflow-y:auto;color:#eee;">
  <div style="max-width:1000px;margin:0 auto;padding:18px 16px 60px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div style="font-size:22px;font-weight:bold;color:#ffd27a;">📖 帝國圖鑑</div>
      <div onclick="closeCodex()" style="cursor:pointer;font-size:14px;background:#444;padding:6px 16px;border-radius:8px;">✕ 關閉 (Esc)</div>
    </div>
    <div id="codexTabs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;"></div>
    <div id="codexBody"></div>
  </div>
</div>
<div id="lobby" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;overflow-y:auto;
  flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;">
  <div style="font-size:44px;">🌐</div>
  <div id="lbTitle" style="font-size:22px;font-weight:bold;margin:8px 0;">真人對戰（Beta）</div>
  <div id="lbBody" style="font-size:13px;color:#bbb;max-width:430px;line-height:1.8;padding:0 16px;">
    開房後將連結傳俾朋友，佢一開就入到你局。<br>你做藍方，朋友做紅方。（用 P2P 連線，雙方都要開住個 page）
  </div>
  <div id="lbSettings" style="margin:12px 0;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#ccc;text-align:left;max-width:300px;">
    <div style="display:flex;justify-content:space-between;align-items:center;"><label>勝利條件：</label><select id="lbVict" style="background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:4px 8px;font-size:12px;"><option value="tc" selected>摧毀主堡</option><option value="annihilate">殲滅全軍</option><option value="timed">15分鐘計分</option></select></div>
	    <div style="display:flex;justify-content:space-between;align-items:center;"><label>初始資源：</label><select id="lbRes" style="background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:4px 8px;font-size:12px;"><option value="std">標準 (100🪵80🍓)</option><option value="rich">富裕 (500🪵500🍓200🪨200💰)</option></select></div>
    <div style="display:flex;justify-content:space-between;align-items:center;"><label>AI 難度：</label><select id="lbAi" style="background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:4px 8px;font-size:12px;"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select></div>
    <div style="display:flex;justify-content:space-between;align-items:center;"><label>日夜循環：</label><select id="lbDay" style="background:#222;color:#fff;border:1px solid #555;border-radius:6px;padding:4px 8px;font-size:12px;"><option value="on" selected>開啟</option><option value="off">關閉（鎖正午）</option></select></div>
  </div>
  <div id="lbLink" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.textContent);this.style.borderColor='#6f6'"
    style="display:none;margin:14px;padding:10px 14px;background:#222;border-radius:8px;font-size:12px;
    max-width:82%;word-break:break-all;cursor:pointer;border:1px solid #555;"></div>
  <div id="lbHint" style="display:none;font-size:11px;color:#888;">↑ 點一下複製，傳俾朋友，等佢加入…</div>
  <div style="margin-top:16px;display:flex;gap:10px;">
    <button id="lbHostBtn" onclick="mpHost()" style="font-size:15px;padding:10px 26px;background:#3070d0;color:#fff;
      border:none;border-radius:10px;cursor:pointer;font-weight:bold;">🏠 開房做主機</button>
    <button onclick="startSinglePlayer()" style="font-size:15px;padding:10px 26px;background:#409050;color:#fff;
      border:none;border-radius:10px;cursor:pointer;font-weight:bold;">⚔️ 單機</button>
    <button onclick="closeLobby()" style="font-size:15px;padding:10px 26px;background:#444;color:#eee;
      border:none;border-radius:10px;cursor:pointer;">返回</button>
  </div>
  <div style="margin-top:10px;display:none;gap:8px;" id="lbJoinRow">
    <input id="lbJoinInput" placeholder="貼上 Room ID…" style="font-size:13px;padding:8px 12px;background:#222;color:#fff;
      border:1px solid #555;border-radius:8px;width:200px;text-align:center;">
    <button onclick="mpJoin(document.getElementById('lbJoinInput').value.trim())" style="font-size:13px;padding:8px 18px;
      background:#409050;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">🚪 加入</button>
    <button onclick="mpSpectate(document.getElementById('lbJoinInput').value.trim())" style="font-size:13px;padding:8px 18px;
      background:#7060b0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">👁️ 觀戰</button>
  </div>
</div>
<div id="status"></div>
<div id="bmenu">
  <span class="label" id="bmenuLabel"></span>
  <button id="btnHouse" onclick="startBuild('house')" style="display:none">🏠房屋 <span class="cost">🪵30</span></button>
  <button id="btnBarracks" onclick="startBuild('barracks')" style="display:none">⚔️兵營 <span class="cost">🪵50</span><span class="costF">🍓20</span></button>
  <button id="btnTower" onclick="startBuild('tower')" style="display:none">🏗️箭塔 <span class="cost">🪵60</span><span class="costS">🪨40</span></button>
  <button id="btnWall" onclick="startBuild('wall')" style="display:none">🧱城牆 <span class="cost">🪵10</span></button>
  <button id="btnClear" onclick="startClear()" style="display:none">🧹清地 <span class="costS">移除樹/石/果叢</span></button>
  <button id="btnTrainVil" onclick="trainVillager()" style="display:none">👤村民 <span class="costF">🍓50</span></button>
  <button id="btnAutoVil" onclick="autoDistributeVils()" style="display:none;border-color:#80d040;">⚖️ 自動分工</button>
  <button id="btnSword" onclick="trainUnit('swordsman')" style="display:none">🗡️劍兵 <span class="costF">🍓60</span><span class="cost">🪵10</span></button>
  <button id="btnArch" onclick="trainUnit('archer')" style="display:none">🏹弓兵 <span class="costF">🍓40</span><span class="cost">🪵40</span></button>
  <button id="btnHorse" onclick="trainUnit('horseman')" style="display:none">🐴騎兵 <span class="costF">🍓80</span><span class="cost">🪵20</span></button>
  <button id="btnCata" onclick="trainUnit('catapult')" style="display:none">🪨投石車 <span class="cost">🪵80</span><span class="costF">🍓60</span><span class="costS">🪨30</span></button>
  <button id="btnFormLine" onclick="setFormation('line')" style="display:none;border-color:#4080d0;">━━ 橫排</button>
  <button id="btnFormBox" onclick="setFormation('box')" style="display:none;border-color:#80d040;">◫ 方陣</button>
  <button id="btnFormScatter" onclick="setFormation('scatter')" style="display:none;border-color:#d08040;">✦ 散開</button>
  <button id="btnT1" onclick="doResearch('lumber')" style="display:none">🪓伐木效率 <span class="cost">🪵50</span><span class="costF">🍓30</span></button>
  <button id="btnT2" onclick="doResearch('military')" style="display:none">⚔️軍事訓練 <span class="costF">🍓60</span><span class="cost">🪵20</span></button>
  <button id="btnT3" onclick="doResearch('speed')" style="display:none">🏃行軍速度 <span class="costF">🍓50</span></button>
  <button id="btnT4" onclick="doResearch('heal')" style="display:none">🏥急救術 <span class="costF">🍓40</span><span class="costS">🪨20</span></button>
  <button id="btnMill" onclick="startBuild('mill')" style="display:none">🌾磨坊 <span class="costF">🍓60</span><span class="cost">🪵100</span></button>
  <button id="btnBlacksmith" onclick="startBuild('blacksmith')" style="display:none">⚒️鍛造廠 <span class="cost">🪵150</span><span class="costG">💰50</span></button>
  <button id="btnCastle" onclick="startBuild('castle_bldg')" style="display:none">🏰城堡 <span class="costS">🪨650</span></button>
  <button id="btnSpear" onclick="trainUnit('spearman')" style="display:none">🗡️矛兵 <span class="costF">🍓35</span><span class="cost">🪵25</span></button>
  <button id="btnKnight" onclick="trainUnit('knight')" style="display:none">🐴騎士 <span class="costF">🍓60</span><span class="costG">💰75</span></button>
  <button id="btnMassArm" onclick="trainUnit('mass_archer')" style="display:none">🏹連弩兵 <span class="costF">🍓50</span><span class="cost">🪵50</span><span class="costG">💰25</span></button>
	  <button id="btnMonk" onclick="trainUnit('monk')" style="display:none">🙏僧侶 <span class="costF">🍓30</span><span class="costG">💰100</span></button>
	  <button id="btnScout" onclick="trainUnit('scout')" style="display:none">🔭斥候 <span class="costF">🍓30</span></button>
  <button id="btnAgeUp" onclick="advanceAge()" style="display:none">⬆️升級時代 <span id="ageUpCost"></span></button>
  <button id="btnBS1" onclick="doResearch('iron')" style="display:none">⚔️鐵器鍛造 <span class="cost">🪵100</span><span class="costG">💰75</span></button>
  <button id="btnBS2" onclick="doResearch('shield')" style="display:none">🛡️強化盔甲 <span class="cost">🪵75</span><span class="costG">💰50</span></button>
  <button id="btnBS3" onclick="doResearch('range')" style="display:none">🏹長弓術 <span class="costF">🍓60</span><span class="costG">💰50</span></button>
	  <button id="btnTW1" onclick="doResearch('fortwall')" style="display:none">🧱城牆強化 <span class="cost">🪵150</span><span class="costS">🪨100</span></button>
	  <button id="btnTW2" onclick="doResearch('horsespd')" style="display:none">🐴快馬 <span class="costF">🍓100</span><span class="costG">💰60</span></button>
	  <button id="btnTW3" onclick="doResearch('goldmine')" style="display:none">💰採金術 <span class="costF">🍓80</span><span class="cost">🪵50</span></button>
</div>
<div id="minimap"><canvas id="mc" width="180" height="135"></canvas></div>
<div id="mobileBar">
  <button onclick="selectAllVils()" title="全選村民">👨‍🌾</button>
  <button onclick="selectAllMil()" title="全選士兵">⚔️</button>
  <button onclick="escAction()" title="取消">✖️</button>
</div>
<div id="grpLabels"></div>
<div id="unitInfo" style="display:none;position:fixed;bottom:80px;left:8px;z-index:9;
  background:rgba(0,0,0,.7);border:1px solid #555;border-radius:10px;padding:8px 12px;
  color:#eee;font-size:12px;min-width:150px;pointer-events:none;backdrop-filter:blur(3px);">
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="uiIcon" style="font-size:26px;"></span>
    <div>
      <div id="uiName" style="font-weight:bold;font-size:13px;"></div>
      <div id="uiCount" style="color:#999;font-size:10px;"></div>
    </div>
  </div>
  <div style="background:#333;border-radius:3px;height:6px;margin:6px 0 3px;overflow:hidden;">
    <div id="uiHpBar" style="background:#4a4;height:6px;width:100%;transition:width .2s;"></div>
  </div>
  <div id="uiStats" style="color:#bbb;font-size:11px;line-height:1.6;"></div>
</div>
<div id="ageUpProgress">⬆️ 升級中… <span id="ageUpPct">0%</span></div>
<div id="alert"></div><div id="alertDot"></div>
<div id="statsPanel">
  <div id="spIcon" style="font-size:56px;margin-bottom:8px;"></div>
  <div id="spTitle" style="font-size:26px;font-weight:bold;margin-bottom:4px;"></div>
  <div id="spSub" style="font-size:13px;color:#aaa;margin-bottom:12px;"></div>
  <canvas id="tlChart" width="340" height="160" style="margin:8px 0;border-radius:6px;background:rgba(0,0,0,.4);"></canvas>
  <table id="spTable"></table>
  <button onclick="location.reload()" style="margin-top:16px;font-size:16px;padding:12px 32px;
    background:#ffd250;color:#111;border:none;border-radius:10px;cursor:pointer;font-weight:bold;">再玩一局</button>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
// ================= 3D 基本 =================
const canvas=document.getElementById('c');
const ov=document.getElementById('ov'),octx=ov.getContext('2d');
const mc=document.getElementById('mc'),mctx=mc.getContext('2d');
let W,H;
const WORLD={w:2400,h:1800,T:80};
const S=10; // 邏輯座標(2D px) → 3D 單位

function wallTierForAge(ageKey){const i=AGES[ageKey].idx;return i>=3?3:i>=2?2:1;} // dark/feudal=木, castle=石, imperial=堡壘

// 升時代 → 升級該隊現有城牆（外觀＋血量按等級重設，保留現有血量比例）
function upgradeWalls(team,ageKey){const newTier=wallTierForAge(ageKey);
  for(const b of buildings){if(b.type!=='wall'||b.team!==team)continue;
    if((b.tier||1)>=newTier)continue;
    const ratio=b.maxHp>0?b.hp/b.maxHp:1;const ti=WALL_TIERS[newTier];
    b.tier=newTier;b.maxHp=ti.hp;b.name=ti.name;b.hp=Math.max(1,Math.round(ti.hp*ratio));
    if(b.mesh){scene.remove(b.mesh);b.mesh=makeBuildingMesh(b);place(b.mesh,b.x+b.w/2,b.y+b.h/2);scene.add(b.mesh);}
  }}

const garrisonMap=new Map(); // building id → [{unit data}]
const GARRISON_CAP={tc:10,tower:5,castle_bldg:15}; // 駐軍上限
function garrisonUnit(b){
  if(!b||!b.id)return;const cap=GARRISON_CAP[b.type]||0;if(!cap)return;
  let g=garrisonMap.get(b.id);if(!g){g=[];garrisonMap.set(b.id,g);}
  if(g.length>=cap){showStatus('駐軍已滿');return;}
  const cx=b.x+b.w/2,cy=b.y+b.h/2;
  // 優先攞「已選取」嘅單位（揀好弓兵再撳駐軍，唔使佢 idle）；否則攞附近 idle 士兵
  let nearby=units.filter(u=>u.team===b.team&&u.hp>0&&u.sel&&Math.hypot(u.x-cx,u.y-cy)<170);
  if(!nearby.length)nearby=units.filter(u=>u.team===b.team&&u.hp>0&&u.type!=='villager'&&u.state==='idle'&&Math.hypot(u.x-cx,u.y-cy)<120);
  nearby=nearby.slice(0,cap-g.length);
  if(!nearby.length){
    const selFar=units.some(u=>u.team===b.team&&u.sel&&u.hp>0);
    showStatus(selFar?'選取嘅單位要行近箭塔先 (≤170)':'先選士兵（框住）再撳駐軍');return;}
  nearby.forEach(u=>{
    g.push({type:u.type,hp:u.hp,mh:u.mh,atk:u.atk,sp:u.sp,rng:u.rng,sz:u.sz,hat:u.hat,dir:u.dir,team:u.team});
    if(u.mesh){scene.remove(u.mesh);u.mesh=null;u.mixer=null;u.actions=null;}
    const idx=units.indexOf(u);if(idx>=0)units.splice(idx,1);});
  if(b.atk!==undefined)b.atk=(b.atk||0)+nearby.length; // 攻擊力加成
  upPop();showStatus(`🏰 駐軍 ${nearby.length}人 (共${g.length}/${cap})`);}
function ungarrisonUnit(b){
  const g=garrisonMap.get(b.id);if(!g||!g.length){showStatus('無駐軍');return;}
  const released=g.splice(0,g.length);
  released.forEach(u=>{
    const nu=makeUnit(b.x+b.w/2-10+Math.random()*20,b.y+b.h+16,u.type,u.team);
    nu.hp=u.hp;nu.mh=u.mh;nu.atk=u.atk;nu.sp=u.sp;nu.rng=u.rng;nu.dir=u.dir;
    nu.tx=b.x+b.w/2+(Math.random()-.5)*60;nu.ty=b.y+b.h+30+Math.random()*20;nu.state='moving';
    units.push(nu);});

  if(x<etc.x+etc.w+20&&x+bw>etc.x-20&&y<etc.y+etc.h+20&&y+bh>etc.y-20)return 0;
  for(const t of trees)if(t.res>0&&t.x>x-12&&t.x<x+bw+12&&t.y>y-12&&t.y<y+bh+12)return 0;
  for(const b of[...buildings]){if(!b.complete)continue;
    const ww=(bt==='wall'&&b.type==='wall');

function clearAround(wpos){
  const R=58; // 清除半徑
  let removed=0;
  for(const arr of[trees,bushes,stones,goldMines]){
    for(let i=arr.length-1;i>=0;i--){const o=arr[i];
      if(Math.hypot(o.x-wpos.x,o.y-wpos.y)<=R){
        if(o.mesh)scene.remove(o.mesh);
        // 有村民正採緊呢個資源 → 解除
        for(const u of units)if(u.tRes===o){u.tRes=null;u.state='idle';}
        arr.splice(i,1);removed++;
        spawnFx(o.x,o.y,o.type==='wood'?'#8a6a30':o.type==='food'?'#c04050':o.type==='gold'?'#f4d03f':'#999',8);
      }}
  }
  // 同一個掣：連自己嘅城牆都拆走（方便整理牆線，唔使另開掣）
  for(let i=buildings.length-1;i>=0;i--){const b=buildings[i];
    if(b.type==='wall'&&b.team==='player'&&Math.hypot(b.x+b.w/2-wpos.x,b.y+b.h/2-wpos.y)<=R+12){
      if(b.mesh)scene.remove(b.mesh);
      for(const u of units)if(u.tEn===b){u.tEn=null;u.state='idle';} // 有單位打緊呢道牆 → 解除
      buildings.splice(i,1);removed++;
      spawnFx(b.x+b.w/2,b.y+b.h/2,'#a8a8a8',8);

}

function drawTimeline(){
  const c=document.getElementById('tlChart');if(!c||timeline.length<2)return;
  const ctx=c.getContext('2d');const W2=c.width,H2=c.height;ctx.clearRect(0,0,W2,H2);
  const pad=30;const gw=W2-pad*2,gh=H2-pad*2;
  const maxT=timeline[timeline.length-1].t||1;
  let maxV=10;for(const p of timeline){maxV=Math.max(maxV,p.w+p.f+p.s+p.g,p.m*8,p.v*5,p.k*6);}
  const sx=t=>pad+(t/maxT)*gw,sy=v=>pad+gh-(v/Math.max(1,maxV))*gh;
  // grid + labels
  ctx.fillStyle='#aaa';ctx.font='9px sans-serif';ctx.textAlign='center';
  for(let i=0;i<=4;i++){const y=pad+gh*i/4;ctx.fillStyle='#333';ctx.fillRect(pad,y,gw,1);ctx.fillStyle='#aaa';ctx.fillText(Math.round(maxV*(1-i/4)),pad-4,y+3);}
  ctx.fillText('0',pad-4,pad+gh+3);ctx.fillText(maxT+'s',W2-pad,pad+gh+16);
  // legend
  const series=[{name:'資源',key:['w','f','s','g'],color:'#f4d03f',sum:1},
    {name:'我軍',key:['m'],color:'#4a90e0',mul:8},{name:'我民',key:['v'],color:'#80d0ff',mul:5},{name:'我殺',key:['k'],color:'#40a0ff',mul:6},
    {name:'敵軍',key:['em'],color:'#e05050',mul:8},{name:'敵民',key:['ev'],color:'#ff8080',mul:5},{name:'敵殺',key:['el'],color:'#ff4040',mul:6}];
  ctx.font='9px sans-serif';let lx=pad;
  for(const s of series){ctx.fillStyle=s.color;ctx.fillText(s.name,lx,12);lx+=ctx.measureText(s.name).width+16;}
  // draw lines
  for(const s of series){
    ctx.strokeStyle=s.color;ctx.lineWidth=1.5;ctx.beginPath();
    for(let i=0;i<timeline.length;i++){
      let v=0;for(const k of s.key)v+=(timeline[i][k]||0)*(s.mul||1);
      const x=sx(timeline[i].t),y=sy(v);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();}
}

function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];
    p.t+=dt;const k=Math.min(1,p.t/p.dur);
    if(p.type==='arrow'&&p.target&&p.target.hp>0){

      p.ty=p.target.h?p.target.y+p.target.h/2:p.target.y;}
    const x=p.sx+(p.tx-p.sx)*k,y=p.sy+(p.ty-p.sy)*k;
    const h=p.h0+( (p.type==='arrow'?1.2:0.6) - p.h0 )*k + Math.sin(Math.PI*k)*p.arc;
    const px=p.mesh.position.x,pz=p.mesh.position.z,py2=p.mesh.position.y;
    p.mesh.position.set(x/S,h,y/S);
    if(p.type==='arrow'){

      p.mesh.rotation.y=Math.atan2(dx,dz);

    if(k>=1){

function blockedAt(x,y){
  const m=2;
  for(const b of buildings){
    if(!b.complete||b.hp<=0)continue;
    if(x>b.x-m&&x<b.x+b.w+m&&y>b.y-m&&y<b.y+b.h+m)return true;
  }
  return false;
}
// 單位「真正目標」（tx/ty 行 path 時係途徑點，唔係終點）→ 看門狗用嚟判斷有冇接近終點
function goalOf(v){
  // 卸貨返主堡：終點係主堡，唔係仲 set 住嘅 tRes 樹（否則看門狗會拉佢掉返轉頭去樹 → 死循環）
  if(v.state==='returning')return tcCenter(v.team==='enemy'?etc:tc);
  if(v.state==='building'&&v.tBldg)return{x:v.tBldg.x+(v.tBldg.w||40)/2,y:v.tBldg.y+(v.tBldg.h||40)/2};
  if(v.tEn&&v.tEn.hp>0)return{x:v.tEn.x,y:v.tEn.y};
  if(v.tRes&&v.tRes.res>0)return{x:v.tRes.x,y:v.tRes.y};
  if(v.aMove)return{x:v.aMoveX,y:v.aMoveY};
  if(v.path&&v.path.length)return v.path[v.path.length-1];
  return{x:v.tx,y:v.ty};
}
function repathTo(v,g){
  const p=aStar(v.x,v.y,g.x,g.y);
  if(p&&p.length){v.path=p;v.pi=0;v.tx=p[0].x;v.ty=p[0].y;return true;}
  return false;
}
// 城牆擋箭：線段 (x0,y0)->(x1,y1) 有冇穿過任何完成城牆（兩隊都擋；ignore=唔計呢道牆，攻牆本身嗰陣用）
function segHitsWall(x0,y0,x1,y1,ignore){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.max(2,Math.ceil(d/14));
  for(const b of buildings){
    if(b.type!=='wall'||!b.complete||b.hp<=0||b===ignore)continue;
    for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return true;}
  }
  return false;
}
// 線段上最近嘅「敵方」城牆（拆牆破關用）
function enemyWallOnSeg(x0,y0,x1,y1,team){
  let best=null,bd=1e9;const d=Math.hypot(x1-x0,y1-y0),n=Math.max(2,Math.ceil(d/14));
  for(const b of buildings){
    if(b.type!=='wall'||!b.complete||b.hp<=0||b.team===team)continue;
    for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){const dd=(x-x0)**2+(y-y0)**2;if(dd<bd){bd=dd;best=b;}break;}}
  }
  return best;
}
function mvUnit(v,dt){
  stepCooldown=Math.max(0,stepCooldown-dt);
  const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);
  if(d>2){v.mv=1;
    const spd=v.type==='horseman'||v.type==='knight'?10:v.type==='catapult'?4:8;
    const prevWt=v.wt; v.wt+=dt*spd;
    const s=Math.min(d,v.sp*dt);
    const nx=v.x+dx/d*s,ny=v.y+dy/d*s;
    // 滑牆式碰撞：中心點永遠唔可以入任何完成建築嘅 rect（含 margin）→ 100% 封死
    if(!blockedAt(nx,ny)){
      v.x=nx;v.y=ny;v.dir=Math.atan2(dx,dy);
    }else if(!blockedAt(nx,v.y)){
      v.x=nx;v.dir=Math.atan2(dx,dy);          // 沿牆滑 X
    }else if(!blockedAt(v.x,ny)){
      v.y=ny;v.dir=Math.atan2(dx,dy);          // 沿牆滑 Y
    }
    // 無進度看門狗：貪心移動時（冇行緊 A* path），若一段時間都冇接近真正目標
    // → 即係正貼住牆滑或者卡死 → 重算 A* 繞路。解決「沿直牆滑到天荒地老都唔識繞」。
    if(!v.path||v.pi>=v.path.length){
      const g=goalOf(v),gd=Math.hypot(g.x-v.x,g.y-v.y);
      if(v.bestGd===undefined||gd<v.bestGd-3||gd>v.bestGd+60){v.bestGd=gd;v.progT=0;}
      else{
        v.progT=(v.progT||0)+dt;
        // 隨機 0.9~1.3s 觸發 → 散開重算時間，唔會同幀全部單位齊齊跑 A*
        if(v.progT>(v.rpThr||(v.rpThr=.9+Math.random()*.4))){
          v.progT=0;v.bestGd=gd;v.rpThr=.9+Math.random()*.4;repathTo(v,g);
        }
      }
    }else{v.bestGd=undefined;v.progT=0;}
    if(Math.sin(prevWt)>=0&&Math.sin(v.wt)<0){
      const heavy=v.type==='horseman'||v.type==='knight'||v.type==='catapult';
      spawnDust(v.x,v.y,heavy);
      if(v.team==='player')playStep(heavy);
    }
  }else{v.mv=0;v.x=v.tx;v.y=v.ty;v.bestGd=undefined;v.progT=0;
    if(v.state==='moving'){
      if(v.tRes&&v.tRes.res>0)v.state='gathering';
      else if(v.tEn&&v.tEn.hp>0)v.state='chase';
      else if(v.tRes){
        // 行到一半棵樹/資源畀人採乾咗 → 搵下一個同類資源，唔好呆企（之前會卡死喺 moving）
        v.tRes=null;
        const pool=v.gType==='wood'?trees:v.gType==='food'?bushes:v.gType==='gold'?goldMines:stones;
        const nxt=pool.filter(r=>r.res>0).sort((a,b)=>Math.hypot(a.x-v.x,a.y-v.y)-Math.hypot(b.x-v.x,b.y-v.y))[0];
        if(nxt){v.tRes=nxt;const e=edgeOf(nxt,v);v.tx=e.x;v.ty=e.y;v.state='moving';}
        else v.state='idle';}
      else if(!v.tEn){
        // Waypoint queue: 到站就 pop 下一個途徑點
        if(v.waypoints&&v.waypoints.length>0){
          const wp=v.waypoints.shift();v.tx=wp.x;v.ty=wp.y;v.state='moving';
          if(v.type!=='villager'&&v.type!=='monk'){v.path=aStar(v.x,v.y,wp.x,wp.y);v.pi=0;v.aMove=true;v.aMoveX=wp.x;v.aMoveY=wp.y;}
        }else v.state='idle';}}
    if(v.state==='villagerWait'){v.state='idle';}
  }
  if(v.path&&v.path.length>v.pi){const wp=v.path[v.pi];if(Math.hypot(wp.x-v.x,wp.y-v.y)<20)v.pi++;
    if(v.pi<v.path.length){v.tx=v.path[v.pi].x;v.ty=v.path[v.pi].y;v.state='moving';}
    else{v.path=null;}}
}
function updateVil(v,dt){
  mvUnit(v,dt);
  if(v.type!=='villager')return;
  if(!v.mv&&v.state==='returning'){
    if(v.team==='player'){
      if(v.gType==='wood'){wood+=v.ca;woodEl.textContent=wood;stats.gathered.wood+=v.ca;}
      else if(v.gType==='food'){food+=v.ca;foodEl.textContent=food;stats.gathered.food+=v.ca;}
      else if(v.gType==='stone'){stone+=v.ca;stoneEl.textContent=stone;stats.gathered.stone+=v.ca;}
      else if(v.gType==='gold'){gold+=v.ca;goldEl.textContent=gold;stats.gathered.gold+=v.ca;}
    }else{
      if(v.gType==='wood')eWood+=v.ca;else if(v.gType==='food')eFood+=v.ca;
      else if(v.gType==='stone')eStone+=v.ca;else if(v.gType==='gold')eGold+=v.ca;
    }
    if(v.ca>0){playDrop();spawnFx(v.x,v.y,'#ffd250',6);}v.ca=0;
    const pool=v.gType==='wood'?trees:v.gType==='food'?bushes:v.gType==='gold'?goldMines:stones;
    const nxt=(v.tRes&&v.tRes.res>0)?v.tRes:pool.filter(r=>r.res>0).sort((a,b)=>Math.hypot(a.x-v.x,a.y-v.y)-Math.hypot(b.x-v.x,b.y-v.y))[0];
    if(nxt){v.tRes=nxt;const e=edgeOf(nxt,v);v.tx=e.x;v.ty=e.y;v.state='moving';}
    else{v.state='idle';v.tRes=null;}
  }
  if(!v.mv&&v.state==='building'&&v.tBldg){const b=v.tBldg;
    if(!b.complete){b.p+=dt;v.cs=Math.sin(performance.now()/200)*.5+.5;
      if(b.p>=b.bt){b.complete=1;b.hp=b.maxHp;
        if(b.type==='house'||b.pb){if(b.team==='player')popCap+=b.pb;}
        if(b.type==='mill'&&b.complete){for(const uu of units){if(uu.type==='villager'&&uu.team===b.team)uu.gi=Math.max(.22,uu.gi*.9);}}
        playBuildDone();playDrop();spawnFx(b.x+b.w/2,b.y+b.h/2,'#ffd250',16);showStatus(b.name+'完成！');
        v.state='idle';v.tBldg=null;}}
    else{v.state='idle';v.tBldg=null;}
  }
  if(v.state==='gathering'&&v.tRes){const t=v.tRes;
    if(t.res<=0){v.cs=0;
      if(v.ca>0){v.state='returning';const c=tcCenter(v.team==='enemy'?etc:tc);v.tx=c.x;v.ty=c.y;}
      else{const pool=v.gType==='wood'?trees:v.gType==='food'?bushes:v.gType==='gold'?goldMines:stones;
        const nxt=pool.filter(r=>r.res>0).sort((a,b)=>Math.hypot(a.x-v.x,a.y-v.y)-Math.hypot(b.x-v.x,b.y-v.y))[0];
        if(nxt){v.tRes=nxt;const e=edgeOf(nxt,v);v.tx=e.x;v.ty=e.y;v.state='moving';}
        else{v.state='idle';v.tRes=null;}}}
    else{v.gt+=dt;v.cs=(v.gt/v.gi)%1;
      v.dir=Math.atan2(t.x-v.x,t.y-v.y);
      if(v.gt>=v.gi){v.gt=0;const a=Math.min(2,t.res);t.res-=a;v.ca+=a;spawnChips(t,v);t.st=.15;
        if(t.type==='wood')playChop();else if(t.type==='food')playPick();else play(400,200,.06,.15,'sawtooth');
        if(v.ca>=v.cm){const c=tcCenter(v.team==='enemy'?etc:tc);v.tx=c.x;v.ty=c.y;v.state='returning';v.cs=0;}}
      if(t.st>0)t.st-=dt;}}
}
function updateCombat(v,dt){
  if(v.hp<=0)return;
  const foe=v.team==='player'?'enemy':'player';
  // A-Move: 移動中掃敵, 見到就打
  if(v.aMove&&v.state==='moving'&&v.type!=='villager'&&v.type!=='monk'){
    const near=units.find(u=>u.team===foe&&u.hp>0&&Math.hypot(u.x-v.x,u.y-v.y)<v.rng*1.4);
    if(near){v.tEn=near;v.state='chase';v.aMove=false;v.tx=near.x;v.ty=near.y;v.path=null;}
  }
  // A-Move: 打完繼續行去目的地
  if(v.aMove&&v.state==='idle'&&!v.tEn&&v.type!=='villager'){
    v.tx=v.aMoveX;v.ty=v.aMoveY;v.state='moving';v.tEn=null;v.tRes=null;}
  // Patrol: 到站就掉頭
  if(v.patrol&&v.state==='moving'&&Math.hypot(v.x-v.patrolX,v.y-v.patrolY)<30){
    [v.patrolX,v.patrolDestX]=[v.patrolDestX,v.patrolX];[v.patrolY,v.patrolDestY]=[v.patrolDestY,v.patrolY];
    v.tx=v.patrolX;v.ty=v.patrolY;}
  // Patrol: 巡邏途中自動接敵
  if(v.patrol&&v.state==='moving'&&v.type!=='villager'&&v.type!=='monk'){
    const near=units.find(u=>u.team===foe&&u.hp>0&&Math.hypot(u.x-v.x,u.y-v.y)<v.rng*1.5);
    if(near){v.tEn=near;v.state='chase';v.path=null;}
  }
  // Patrol: 打完返去繼續巡
  if(v.patrol&&v.state==='idle'&&!v.tEn&&v.type!=='villager'){v.tx=v.patrolX;v.ty=v.patrolY;v.state='moving';}
  if(v.team==='enemy'&&v.type!=='monk'&&v.state==='idle'&&!v.tEn){
    const px=v.patrolX||v.x,py=v.patrolY||v.y;
    if(Math.hypot(v.x-px,v.y-py)>120){v.tx=px;v.ty=py;v.state='moving';}
    else if(Math.random()<.005){v.tx=px+(Math.random()-.5)*250;v.ty=py+(Math.random()-.5)*250;v.state='moving';}
    const cl=gameTime>=180?units.find(u=>u.team==='player'&&u.hp>0&&Math.hypot(u.x-v.x,u.y-v.y)<220):null;
    if(cl){v.tEn=cl;v.state='chase';}
  }
  if((v.state==='chase'||v.state==='attack')&&v.tEn&&v.type!=='monk'){
    const e=v.tEn;
    if(e.hp!==undefined&&e.hp<=0){v.state='idle';v.tEn=null;v.engStuck=0;return;}
    const ex=e.w?(e.x+e.w/2):e.x, ey=e.h?(e.y+e.h/2):e.y;
    const dd=Math.hypot(ex-v.x,ey-v.y);
    const tgtIsUnit=(e.w===undefined); // 建築有 w，單位冇
    const inRange=dd<=v.rng+20;
    // 城牆擋箭：地面弓兵射唔穿牆（投石車拋物線 / 箭塔升高 唔受限）；攻緊嗰道牆唔計自己
    const losClear=v.type==='catapult'||v.rng<100||!segHitsWall(v.x,v.y,ex,ey,e.type==='wall'?e:null);
    // 想打單位但打唔到（近戰畀牆圍死 / 弓兵射唔穿）→ 若繞極都接近唔到目標（即係真‧圍死，
    // 唔係短牆可繞）→ 拆擋路嘅敵牆。用「對目標距離冇改善」判斷，移動看門狗繞到就會接近 → 唔會誤拆。
    if(v.type!=='catapult'&&tgtIsUnit&&!(inRange&&losClear)){
      if(v.engBest===undefined||dd<v.engBest-4){v.engBest=dd;v.engStuck=0;}
      else v.engStuck=(v.engStuck||0)+dt;
      if(v.engStuck>1.5){v.engStuck=0;v.engBest=dd;
        const w=enemyWallOnSeg(v.x,v.y,ex,ey,v.team);if(w)v.tEn=w;
      }
    }else{v.engStuck=0;v.engBest=undefined;}
    if(inRange&&losClear){v.state='attack';v.tx=v.x;v.ty=v.y;
      v.dir=Math.atan2(ex-v.x,ey-v.y);
      v.at-=dt;
      if(v.at<=0){v.at=v.cd;
        if(v.type==='catapult'){
          // 投石：射向目標當前位置，落地先爆（範圍傷害，建築 3x）
          spawnProj({x:v.x,y:v.y,h0:2.4,type:'rock',tx:ex,ty:ey,dmg:v.atk,team:v.team,
            splash:UNIT_DEFS.catapult.splash||65});
          play(120,60,.2,.3,'sawtooth');
        }else if(v.rng>=100){
          // 弓兵/連弩兵：射箭（追蹤目標）
          spawnProj({x:v.x,y:v.y,h0:1.7,type:'arrow',tx:ex,ty:ey,target:e,dmg:v.atk,team:v.team});
          play(880,460,.07,.12);
        }else{
          const bonusMult=(v.bonus&&e.type&&v.bonus[e.type])||1;
          playHit();dealDamage(e,v.atk*bonusMult,v.team);
        }}}
    else{v.state='chase';v.tx=ex;v.ty=ey;}
  }
  if(v.team==='player'&&v.type!=='villager'&&v.type!=='monk'&&v.state==='idle'){
    const ce=units.find(u=>u.team==='enemy'&&u.hp>0&&Math.hypot(u.x-v.x,u.y-v.y)<v.rng*1.5);
    if(ce){v.tEn=ce;v.state='attack';}
  }
  if(v.team==='player'&&v.type==='villager'&&v.state==='idle'){
    const ce=units.find(u=>u.team==='enemy'&&u.hp>0&&Math.hypot(u.x-v.x,u.y-v.y)<80);
    if(ce){v.tEn=ce;v.state='chase';v.tx=ce.x;v.ty=ce.y;}
  }
}
function updateTowers(dt){
  for(const b of buildings){if(!b.complete||!b.atk||b.hp<=0)continue;
    const target=units.find(u=>u.team!==b.team&&u.hp>0&&Math.hypot(u.x-(b.x+b.w/2),u.y-(b.y+b.h/2))<b.rng);
    if(target){b.at-=dt;if(b.at<=0){b.at=b.cd;
      spawnProj({x:b.x+b.w/2,y:b.y+b.h/2,h0:b.type==='castle_bldg'?11:8.6,
        type:'arrow',tx:target.x,ty:target.y,target,dmg:b.atk,team:b.team});
      play(880,460,.07,.1);}}}
}

function enemyAI(dt){
  eaiTimer+=dt;const cfg=AI_CFG[aiDiff];if(eaiTimer<EAI_INTERVAL*cfg.iv)return;eaiTimer=0;
  const pers=PERS[aiPers]||PERS.balanced; // 個性參數
  const eUnits=units.filter(u=>u.team==='enemy'&&u.hp>0);
  const eVils=eUnits.filter(u=>u.type==='villager');
  const eMil=eUnits.filter(u=>u.type!=='villager');
  const eBldgs=buildings.filter(b=>b.team==='enemy');
  const eVilIds=eVils.filter(v=>v.state==='idle');
  const ePopCap=5+eBldgs.filter(b=>b.type==='house'&&b.complete).reduce((s,b)=>s+(b.pb||5),0);
  const pUnits=units.filter(u=>u.team==='player'&&u.hp>0);
  const pMil=pUnits.filter(u=>u.type!=='villager');
  const pBldgs=buildings.filter(b=>b.team==='player'&&b.complete);
  const hasBsk=eBldgs.some(b=>b.type==='barracks'&&b.complete);
  const hasHouse=eBldgs.some(b=>b.type==='house'&&b.complete);
  const hasMill=eBldgs.some(b=>b.type==='mill'&&b.complete);
  const hasBS=eBldgs.some(b=>b.type==='blacksmith'&&b.complete);
  const hasTower=eBldgs.some(b=>b.type==='tower'&&b.complete);
  const eAge=ageIdx(eCurrentAge);
  // cheat resource boost (Hard only)
  if(cfg.cheat>0&&Math.random()<cfg.cheat){eWood+=2;eFood+=2;eStone+=1;eGold+=1;}
  // === Phase 1: 爆經濟 (train villagers) ===
  const wantVils=Math.min(pers.vilMax+Math.floor(cfg.eco*3),ePopCap);
  if(eVils.length<wantVils&&eUnits.length<ePopCap&&eFood>=50){
    eFood-=50;const v=makeUnit(etc.x+etc.w/2-20+Math.random()*40,etc.y+etc.h+10,'villager','enemy');
    v.sp=130;v.patrolX=etc.x;v.patrolY=etc.y;units.push(v);

function canAffordE(c){return(!c.wood||eWood>=c.wood)&&(!c.food||eFood>=c.food)&&(!c.stone||eStone>=c.stone)&&(!c.gold||eGold>=c.gold);}

function applyTech(key,team='player'){

  if(key==='military'){for(const u of units){if(u.team===team&&u.type!=='villager'){u.atk+=4;u.mh=Math.round(u.mh*1.15);u.hp=Math.min(u.hp+Math.round(u.mh*.15),u.mh);}}}
  if(key==='speed'){for(const u of units){if(u.team===team)u.sp=Math.round(u.sp*1.25);}}
  if(key==='iron'){for(const u of units){if(u.team===team&&u.type!=='villager')u.atk+=5;}showStatus('⚔️ '+team+'軍隊攻擊+5');}
  if(key==='shield'){for(const u of units){if(u.team===team&&u.type!=='villager'){u.mh=Math.round(u.mh*1.2);u.hp=Math.min(u.hp+Math.round(u.mh*.1),u.mh);}}showStatus('🛡️ '+team+'軍隊生命+20%');}
  if(key==='range'){for(const u of units){if(u.team===team&&(u.type==='archer'||u.type==='mass_archer')){u.rng=Math.round(u.rng*1.3);u.atk+=3;}}showStatus('🏹 '+team+'弓兵射程+30% 攻擊+3');}
  if(key==='fortwall'){for(const b of buildings){if(b.team===team&&b.type==='wall'&&b.complete){b.maxHp=Math.round(b.maxHp*1.5);b.hp=Math.min(b.hp+Math.round(b.maxHp*.33),b.maxHp);}}showStatus('🧱 '+team+'城牆生命+50%');}
  if(key==='horsespd'){for(const u of units){if(u.team===team&&(u.type==='horseman'||u.type==='knight'))u.sp=Math.round(u.sp*1.15);}showStatus('🐴 '+team+'騎兵速度+15%');}

function spawnWave(){

  else if(waveNum<=2)types=['swordsman','spearman'];
  else if(ai<1)types=['swordsman','archer','spearman'];
  else if(ai<2)types=['swordsman','archer','horseman','catapult'];
  else types=['swordsman','archer','horseman','catapult','knight'];

}
function update(dt){

  for(const u of units){if(u.type==='monk'&&u.hp>0&&u.state==='idle'){
    const hurt=units.find(a=>a.team===u.team&&a.hp>0&&a.hp<a.mh&&a!==u&&Math.hypot(a.x-u.x,a.y-u.y)<u.rng);
    if(hurt){u.tx=hurt.x;u.ty=hurt.y;u.state='moving';u.tEn=null;}
    else u.state='idle';
  }}
  for(const u of units){if(u.type==='monk'&&u.hp>0&&u.state==='moving'){
    const hurt=units.find(a=>a.team===u.team&&a.hp>0&&a.hp<a.mh&&a!==u&&Math.hypot(a.x-u.x,a.y-u.y)<u.rng);
    if(hurt&&Math.hypot(u.x-hurt.x,u.y-hurt.y)<u.rng+30){
      u.tx=u.x;u.ty=u.y;u.state='idle';
      const healAmt=(UNIT_DEFS.monk.heal||6)*dt;
      hurt.hp=Math.min(hurt.mh,hurt.hp+healAmt);
      if(Math.random()<.3)spawnFx(hurt.x,hurt.y,'#80ff80',3);
    }
  }}
  for(const u of units){
    if(u.team==='player'&&u.hp>0&&u.hp<u.mh){
      const healR=techs.heal.done?10:5;
      if(Math.hypot(u.x-(tc.x+50),u.y-(tc.y+50))<120)u.hp=Math.min(u.mh,u.hp+healR*dt);}}

  if(eResearchQueue){const t=eTechs[eResearchQueue];t.rt+=dt;if(t.rt>=t.rtime){const k=eResearchQueue;t.done=true;eResearchQueue=null;applyTech(k,'enemy');}}
  if(!mp.ready){
    waveTimer-=dt;
    if(waveTimer<=0){spawnWave();waveTimer=WAVE_INTERVAL;}
    const wPct=Math.max(0,1-waveTimer/(waveNum===0?180:WAVE_INTERVAL));
    waveFgEl.style.width=(wPct*100).toFixed(1)+'%';
    const ws=Math.max(0,Math.floor(waveTimer));waveEtaEl.textContent=Math.floor(ws/60)+':'+(ws%60<10?'0':'')+(ws%60);
  }
  if(dsEnabled){dsTimer+=dt;if(dsTimer>DS_INTERVAL){dsTimer=0;callDeepSeek();}}
  // annihilate 模式：唔可以淨拆主堡就贏，要殲滅晒（交畀下面個 block 判）
  if(victCond!=='annihilate'){
    if(tc.hp<=0)endGame(false);
    if(etc.hp<=0)endGame(true);
  }
  // 勝利條件
  if(!isGameOver){
    if(victCond==='annihilate'){
      const plAlive=units.some(u=>u.team==='player'&&u.hp>0);
      const enAlive=units.some(u=>u.team==='enemy'&&u.hp>0);
      const plTC=tc.hp>0,enTC=etc.hp>0;

      if(!enAlive&&!enTC)endGame(true);
    }

      const score=(pl,en)=>(units.filter(u=>u.team===pl&&u.hp>0).length*10+units.filter(u=>u.team===pl&&u.type!=='villager'&&u.hp>0).length*20+stats.kills*5)-(stats.losses*5);

  }

let _thumbR=null,_thumbCache={},_thumbsDone=false;
function _getThumbR(){if(_thumbR)return _thumbR;
  _thumbR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  _thumbR.setSize(196,196);_thumbR.setPixelRatio(1);_thumbR.shadowMap.enabled=false;
  if(THREE.SRGBColorSpace)_thumbR.outputColorSpace=THREE.SRGBColorSpace;return _thumbR;}
function _captureThumb(obj,ang,tilt,box){
  const r=_getThumbR();const sc=new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff,0x55654a,1.15));
  const d1=new THREE.DirectionalLight(0xfff2d8,1.6);d1.position.set(4,7,5);sc.add(d1);
  const d2=new THREE.DirectionalLight(0x90b0ff,.45);d2.position.set(-4,2,-3);sc.add(d2);
  sc.add(obj);obj.updateMatrixWorld(true);
  if(!box)box=new THREE.Box3().setFromObject(obj);
  if(box.isEmpty()){sc.remove(obj);return null;}
  const sz=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
  // 半徑取「最闊水平 + 高度」嘅外接球 → 精準 fit、subject 填滿格
  const radius=.5*Math.hypot(Math.max(sz.x,sz.z),sz.y);
  const cam=new THREE.PerspectiveCamera(30,1,.05,3000);
  const dist=radius/Math.tan(15*Math.PI/180)*1.04; // 30° fov 半角=15°，1.04 留少少邊
  cam.position.set(ctr.x+Math.sin(ang)*dist,ctr.y+sz.y*(tilt||.18),ctr.z+Math.cos(ang)*dist);
  cam.lookAt(ctr.x,ctr.y,ctr.z); // 正中 bbox 中心
  r.render(sc,cam);
  const url=r.domElement.toDataURL('image/png');sc.remove(obj);return url;
}
function _unitThumb(k){
  const fu={type:k,team:'player',i:1,hp:10,mh:10,dir:0,sz:20,gi:.4,wt:0,cs:0};
  const m=makeUnitMesh(fu);if(m.userData.ring)m.userData.ring.visible=false;
  m.traverse(o=>{if(o.userData&&o.userData.roleMark)o.visible=false;}); // 收起頭頂徽記
  [fu.mixer,fu.mixH,fu.mixR].forEach(mx=>{if(mx)mx.update(.45);});
  const mounted=(k==='horseman'||k==='knight');
  if(mounted){const rb=m.userData.rb; // 套騎姿(同遊戲 update 一樣)
    if(rb&&rb.ull){rb.ull.rotation.set(-1.25,0,.42);rb.ulr.rotation.set(-1.25,0,-.42);
      rb.lll.rotation.x=1.35;rb.llr.rotation.x=1.35;if(rb.ftl){rb.ftl.rotation.x=-.35;rb.ftr.rotation.x=-.35;}}
    // 馬係 skinned mesh，bind-pose bbox 失真(z~11)→ 用固定已知 box frame 住馬+騎手
    const box=new THREE.Box3(new THREE.Vector3(-1.75,0,-1.95),new THREE.Vector3(1.75,4.3,1.55));
    return _captureThumb(m,0.7,.1,box);
  }
  return _captureThumb(m,0.7,.3);
}

  const total=wood+food+stone+gold+1;const need=[{type:'wood',v:Math.max(0,total*2/6-wood)},{type:'food',v:Math.max(0,total*2/6-food)},{type:'stone',v:Math.max(0,total*1/6-stone)},{type:'gold',v:Math.max(0,total*1/6-gold)}];
  need.sort((a,b)=>b.v-a.v);let assigned=0;
  for(const v of idles){
    for(const n of need){
      const pool=n.type==='wood'?trees:n.type==='food'?bushes:n.type==='stone'?stones:goldMines;
      const t=pool.filter(r=>r.res>0).sort((a,b)=>Math.hypot(a.x-v.x,a.y-v.y)-Math.hypot(b.x-v.x,b.y-v.y))[0];
      if(t){const near=units.filter(u=>u.type==='villager'&&u.team===MYTEAM&&u.tRes===t).length;
        if(near<6){v.tRes=t;v.gType=t.type;v.state='moving';v.tx=t.x;v.ty=t.y;v.path=null;v.pi=0;assigned++;break;}}}
  }
  if(assigned)showStatus('⚖️ 分配 '+assigned+' 個村民');else showStatus('冇可用資源');playClick();};

    const lm=leafMat(0x35803a);
    for(const[y,r,h]of[[3.6,2.0,3.0],[5.1,1.5,2.4],[6.4,1.0,1.9]]){
      const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,9),lm);c.castShadow=true;c.position.y=y;fol.add(c);}
  }else{
    const trunk=cyl(.3,.45,2.8,0x7a5230,8);trunk.position.y=1.4;trunk.rotation.z=(Math.random()-.5)*.12;g.add(trunk);
    const lm=leafMat(0x4d8f3a);

const _WEAPON_RE=/sword|axe|knife|staff|bow|spell|book|offhand|wand|dagger|mace|hammer|shield|weapon|crossbow|quiver/i;
function styleFootUnit(u,model,lib){
  const k=1/lib.scale, t=u.type, en=u.team==='enemy';
  const sR=model.getObjectByName('handslotr'), sL=model.getObjectByName('handslotl');
  // KayKit 模型自帶一拼武器，全部 visible → 先全部收起，再揀返一件（用模型自己嘅靚 mesh）
  model.traverse(m=>{if(m.isMesh&&_WEAPON_RE.test(m.name||''))m.visible=false;});
  const show=names=>model.traverse(m=>{if(m.isMesh&&names.includes(m.name))m.visible=true;});
  // 模型冇嘅武器(長矛/長弓)就自製
  const spear=slot=>{const sh=new THREE.Mesh(new THREE.CylinderGeometry(.03*k,.03*k,2.3*k,6),mat(0x6b4a2a));sh.position.y=.95*k;sh.castShadow=true;slot.add(sh);
    const tp=new THREE.Mesh(new THREE.ConeGeometry(.07*k,.26*k,6),matM(0xd8dde2));tp.position.y=2.15*k;slot.add(tp);};
  const bow=slot=>{const b=new THREE.Mesh(new THREE.TorusGeometry(.36*k,.03*k,6,14,Math.PI*1.25),mat(0x6b4a2a));b.rotation.z=Math.PI/2;b.castShadow=true;slot.add(b);
    const st=new THREE.Mesh(new THREE.CylinderGeometry(.008*k,.008*k,.7*k,4),mat(0xeeeeee));slot.add(st);};
  const quiver=col=>{const sp=model.getObjectByName('spine')||model.getObjectByName('chest');if(!sp)return;
    const q=new THREE.Mesh(new THREE.CylinderGeometry(.08*k,.06*k,.5*k,8),mat(col));q.position.set(.13*k,.05*k,-.16*k);q.rotation.set(-.3,0,.2);sp.add(q);
    for(let i=0;i<3;i++){const a=new THREE.Mesh(new THREE.CylinderGeometry(.009*k,.009*k,.34*k,4),mat(0xddccaa));a.position.set(.13*k+(i-1)*.05*k,.32*k,-.16*k);a.rotation.z=.2;sp.add(a);}};
  if(t==='villager'){ show(['1H_Axe']); }                       // 蠻族＋伐木斧
  else if(t==='swordsman'){ show(['1H_Sword','Round_Shield']); } // 騎士甲＋劍＋圓盾
  else if(t==='spearman'){ if(sR)spear(sR); }                   // 蠻族裸上身＋長矛
  else if(t==='scout'){ show(['Knife']); }                      // 盜賊＋短刀(細隻)
  else if(t==='archer'){ if(sL)bow(sL); quiver(en?0x6e3a22:0x2c5e3a); } // 兜帽盜賊＋長弓
  else if(t==='mass_archer'){ show(['1H_Crossbow']); }          // 盜賊＋自帶弩
  else if(t==='monk'){ show(['2H_Staff']); }                    // 法師長袍＋法杖
}
function makeGLBUnit(u){
  const en=u.team==='enemy';
  const g=new THREE.Group();
  const body=new THREE.Group();g.add(body);g.userData.body=body;
  const lib=charLib[u.type];
  const c=SkeletonUtils.clone(lib.scene);
  c.scale.setScalar(lib.scale*(u.type==='spearman'?.92:u.type==='scout'?.86:1));
  const tintDef=TINTS[u.type]||TINTS.villager;
  const tint=en?tintDef.enemy:tintDef.player;
  c.traverse(m=>{if(m.isMesh){m.castShadow=true;m.frustumCulled=false;
    if(tint){m.material=m.material.clone();if(m.material.color)m.material.color.lerp(new THREE.Color(tint),tintDef.amt);}}});
  body.add(c);
  styleFootUnit(u,c,lib); // 揀返每個兵種應有嘅武器（含村民伐木斧）
  u.mixer=new THREE.AnimationMixer(c);
  const cl=lib.clips;
  u.actions={
    idle:mkAct(u.mixer,cl,[/^idle$/i,/idle/i]),
    walk:mkAct(u.mixer,cl,[/^walking_a$/i,/walking/i,/walk/i]),
    run:mkAct(u.mixer,cl,[/^running_a$/i,/running/i,/run/i]),
    melee:mkAct(u.mixer,cl,[/melee_attack_chop/i,/melee_attack_slice/i,/melee_attack/i,/attack/i]),
    shoot:mkAct(u.mixer,cl,[/ranged_shoot/i,/shoot/i,/ranged/i]),
  };
  if(!u.actions.melee)u.actions.melee=u.actions.idle;
  if(!u.actions.shoot)u.actions.shoot=u.actions.melee;
  if(u.actions.idle){u.actions.idle.play();u.cur='idle';}
  if(u.type==='villager'){
    const carry=box(.5,.36,.78,0xc8a030);carry.position.set(-.4,1.68,0);carry.rotation.z=.15;
    carry.visible=false;body.add(carry);g.userData.carry=carry;}
  g.userData.glb=true;
  g.userData.ring=ringSel(u.type==='swordsman'?1.5:1.4);g.add(g.userData.ring);
  return g;
}

function makeMountedGLB(u){
  const en=u.team==='enemy';const isKnight=u.type==='knight';
  const g=new THREE.Group();const body=new THREE.Group();g.add(body);g.userData.body=body;
  // 馬（放大：馬本來相對騎手細，HM 倍放大，騎手保持步兵大小坐高啲）
  const HM=1.32;
  const h=SkeletonUtils.clone(horseLib.scene);
  h.scale.setScalar(horseLib.scale*HM);
  h.position.set(horseLib.off.x*HM,horseLib.off.y*HM,horseLib.off.z*HM);
  h.traverse(m=>{if(m.isMesh){m.castShadow=true;m.frustumCulled=false;
    m.material=m.material.clone();
    if(en&&m.material.color)m.material.color.lerp(new THREE.Color(0xc03030),.3);
    else if(isKnight&&m.material.color)m.material.color.lerp(new THREE.Color(0x3a2a1a),.25);}});
  const hw=new THREE.Group();hw.add(h);body.add(hw);g.userData.horseW=hw;
  u.mixH=new THREE.AnimationMixer(h);
  if(horseLib.clips[0]){u.actH=u.mixH.clipAction(horseLib.clips[0]);u.actH.play();u.mixH.timeScale=0;}
  // 鞍 + 氈（跟住大馬升高 + 闊啲）
  const lift=1.82*(HM-1); // 馬背升高量
  const bk=box(1.0,.1,1.26,isKnight?0xc8a030:(en?0x8a2828:0x28508a));bk.scale.set(HM,1,HM);bk.position.set(0,1.82+lift,-.43);body.add(bk);
  const sd=box(.72,.15,.82,0x4a3a26);sd.scale.set(HM,1,HM);sd.position.set(0,1.92+lift,-.43);body.add(sd);
  // 騎手模型：騎士=Knight(甲)、騎兵=Barbarian(裸上身)→ 兩者明顯唔同
  const lib=isKnight?charLib.swordsman:(charLib.villager||charLib.swordsman);
  const r=SkeletonUtils.clone(lib.scene);
  r.scale.setScalar(lib.scale);
  r.traverse(m=>{if(m.isMesh){m.castShadow=true;m.frustumCulled=false;
    if(en||isKnight){m.material=m.material.clone();
      if(m.material.color)m.material.color.lerp(new THREE.Color(en?0xc03030:0xc8a030),en?.3:.22);}}});
  r.position.set(0,1.6+lift,-.43); // 騎手跟住大馬坐高
  body.add(r);
  u.mixR=new THREE.AnimationMixer(r);
  const cl=lib.clips;
  u.rActs={idle:mkAct(u.mixR,cl,[/^idle$/i,/idle/i]),
    melee:mkAct(u.mixR,cl,[/melee_attack_chop/i,/melee_attack_slice/i,/melee_attack/i,/attack/i])};
  if(u.rActs.idle){u.rActs.idle.play();u.rCur='idle';}
  g.userData.rb={
    ull:r.getObjectByName('upperlegl'),ulr:r.getObjectByName('upperlegr'),
    lll:r.getObjectByName('lowerlegl'),llr:r.getObjectByName('lowerlegr'),
    ftl:r.getObjectByName('footl'),ftr:r.getObjectByName('footr')};
  // 收起騎手模型自帶嘅全部武器（下面再加返劍／長矛）
  r.traverse(m=>{if(m.isMesh&&_WEAPON_RE.test(m.name||''))m.visible=false;});
  // 武器插喺手 slot
  const slot=r.getObjectByName('handslotr');
  if(slot){const k=1/lib.scale;
    if(isKnight){
      const blade=new THREE.Mesh(new THREE.BoxGeometry(.07*k,.85*k,.024*k),matM(0xd8dde2));
      blade.position.y=.5*k;blade.castShadow=true;slot.add(blade);
      const guard=new THREE.Mesh(new THREE.BoxGeometry(.24*k,.05*k,.06*k),mat(0x8a6a30));
      guard.position.y=.08*k;slot.add(guard);
      // 騎士加圓盾（左手）→ 同騎兵（長矛）明顯唔同
      const sL=r.getObjectByName('handslotl');
      if(sL){const sh=new THREE.Mesh(new THREE.CylinderGeometry(.34*k,.34*k,.08*k,16),mat(en?0x7a2828:0xc8a030));sh.rotation.z=Math.PI/2;sh.position.set(0,.05*k,.05*k);sh.castShadow=true;sL.add(sh);
        const bo=new THREE.Mesh(new THREE.SphereGeometry(.08*k,8,6),matM(0xcfcfd6));bo.position.set(.06*k,.05*k,.05*k);sL.add(bo);}
    }else{
      const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.032*k,.032*k,2.6*k,6),mat(0x8a6a40));
      shaft.position.y=.3*k;shaft.castShadow=true;slot.add(shaft);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(.07*k,.3*k,6),matM(0xc8ccd2));
      tip.position.y=1.75*k;slot.add(tip);
      // 騎兵長矛尾旗
      const flag=new THREE.Mesh(new THREE.BoxGeometry(.01*k,.18*k,.28*k),mat(en?0xc03030:0x3070d0));flag.position.set(0,1.4*k,.14*k);slot.add(flag);
    }}
  g.userData.mounted=1;
  g.userData.ring=ringSel(2.3);g.add(g.userData.ring);
  return g;
}
// 兵種頭頂彩色徽記（共用模型嘅兵種靠呢個分辨）：形狀＋顏色都唔同

const ROLE_MARK={

function roleMark(u){
  const def=ROLE_MARK[u.type];if(!def)return null; // 村民唔加（已經好易認）
  const g=new THREE.Group();g.position.y=u.type==='catapult'?3.2:(u.type==='horseman'||u.type==='knight'?3.6:2.75);
  const m=matE(def.c);
  if(def.shape==='ring'){const t=new THREE.Mesh(new THREE.TorusGeometry(.26,.07,8,16),m);t.rotation.x=Math.PI/2;g.add(t);}
  else if(def.shape==='spike'){const c=new THREE.Mesh(new THREE.ConeGeometry(.15,.72,6),m);g.add(c);}
  else if(def.shape==='double'){const c1=new THREE.Mesh(new THREE.ConeGeometry(.2,.42,8),m);c1.position.x=-.16;g.add(c1);const c2=c1.clone();c2.position.x=.16;g.add(c2);}
  else if(def.shape==='feather'){const c=new THREE.Mesh(new THREE.ConeGeometry(.1,.62,5),m);c.rotation.z=.5;g.add(c);}
  else{const c=new THREE.Mesh(new THREE.ConeGeometry(.27,.5,4),m);g.add(c);} // 4 面菱錐
  g.traverse(o=>{if(o.isMesh)o.castShadow=false;});
  g.userData.roleMark=true;
  return g;
}
function makeUnitMesh(u){const g=_buildUnitMesh(u);const mk=roleMark(u);if(mk)(g.userData.body||g).add(mk);return g;}
function _buildUnitMesh(u){

  const g=new THREE.Group();

  if(u.type==='catapult'){
    const cata=makeCatapult(en);body.add(cata);
    g.userData.cata=cata;
    g.userData.ring=ringSel(2.2);g.add(g.userData.ring);
    return g;
  }
  if(u.type==='villager'){
    human=buildHuman({skin:skinToneOf(u.i),tunic:en?0x9a5a4a:0xb9905e,pants:0x6e5a43,boots:0x4a3826,
      hat:'straw',hatColor:u.hat,weapon:'axe'});
    ringR=1.4;
    const carry=box(.5,.36,.78,0xc8a030);carry.position.set(-.4,1.68,0);carry.rotation.z=.15;
    carry.visible=false;body.add(carry);g.userData.carry=carry;
  }else if(u.type==='swordsman'){
    human=buildHuman({skin:skinToneOf(u.i),tunic:TEAM[u.team],pants:0x4a4a55,boots:0x33302c,
      hat:'helmet',weapon:'sword',shield:true,shieldColor:en?0x7a2828:0x24508c});
  }else if(u.type==='spearman'){
    human=buildHuman({skin:skinToneOf(u.i),tunic:en?0x9a5535:0x5a7a9a,pants:0x55483a,boots:0x3a3026,
      hat:'helmet',weapon:'spear'});
    ringR=1.4;
  }else if(u.type==='archer'||u.type==='mass_archer'){
    const hood=u.type==='mass_archer'?(en?0x7a2050:0x5a3a9a):(en?0x6e3a22:0x2c5e3a);
    human=buildHuman({skin:skinToneOf(u.i),tunic:en?0x8a5535:(u.type==='mass_archer'?0x6a4a9a:0x3a7d4a),

    rg.legR.rotation.x=-1.05;rg.legR.rotation.z=-.55;
    rg.armL.rotation.x=-.5;
    ringR=1.9;
  }
  body.add(human);g.userData.rig=human.userData.rig;
  g.userData.ring=ringSel(ringR);g.add(g.userData.ring);

function syncScene(dt,now){
  for(const t of trees){
    t.mesh.userData.fol.visible=t.res>0;
    t.mesh.children[0].visible=t.res>0;
    t.mesh.userData.stump.visible=t.res<=0;
    t.mesh.rotation.z=t.st>0?Math.sin(now/18)*t.st*.8:0;}
  for(const b of bushes){
    const k=Math.max(.15,b.res/b.mr);
    b.mesh.userData.berries.visible=b.res>0;
    b.mesh.userData.berries.scale.setScalar(k);
    b.mesh.userData.body.scale.setScalar(b.res>0?1:.55);}
  for(const s of stones){
    const k=Math.max(.25,s.res/s.mr);s.mesh.scale.setScalar(.4+.6*k);}
  for(const gm of goldMines){
    const k=Math.max(.25,gm.res/gm.mr);gm.mesh.scale.setScalar(.4+.6*k);}
  // 建築
  smokeAcc+=dt;const doSmoke=smokeAcc>.22;if(doSmoke)smokeAcc=0;
  for(const b of buildings){
    if(!b.mesh){b.mesh=makeBuildingMesh(b);place(b.mesh,b.x+b.w/2,b.y+b.h/2);scene.add(b.mesh);}
    b.mesh.scale.y=b.complete?1:Math.max(.12,b.p/b.bt);
    if(b.mesh.userData.mill&&b.complete)b.mesh.userData.mill.rotation.z+=dt*1.2;
    if(b.mesh.userData.flag)b.mesh.userData.flag.rotation.y=Math.sin(now/400+b.x)*.3;
    if(b.complete&&b.hp>0&&b.hp<b.maxHp*.55&&doSmoke&&Math.random()<.8)
      spawnSmoke(b.x+b.w/2,b.y+b.h/2,3+Math.random()*2,b.hp<b.maxHp*.25);
    if(b.complete&&b.hp<=0&&!b.mesh.userData.dead){b.mesh.userData.dead=1;b.mesh.visible=false;}
    if(b.mesh.userData.chimney&&b.complete&&doSmoke&&Math.random()<.4)
      spawnSmoke(b.mesh.userData.chimney.x,b.mesh.userData.chimney.y,4.8,false);
  }
  // 主堡旗 + 損毀煙
  tcMesh.userData.flag.rotation.y=Math.sin(now/400)*.3;
  etcMesh.userData.flag.rotation.y=Math.sin(now/400+2)*.3;
  for(const[t,m]of[[tc,tcMesh],[etc,etcMesh]]){
    if(t.hp>0&&t.hp<t.mh*.6&&doSmoke&&Math.random()<.8)
      spawnSmoke(t.x+t.w/2-20+Math.random()*40,t.y+t.h/2-20+Math.random()*40,5+Math.random()*3,t.hp<t.mh*.3);
    if(t.hp<=0)m.visible=false;}
  updateSmokes(dt);
  // 單位
  for(const u of units){
    if(!u.mesh){u.mesh=makeUnitMesh(u);scene.add(u.mesh);}
    const m=u.mesh;
    m.position.set(u.x/S,0,u.y/S);
    if(u.dir!==undefined){const cur=m.rotation.y;let d=u.dir-cur;
      while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
      m.rotation.y=cur+d*Math.min(1,dt*12);}
    if(m.userData.mounted){
      if(u.mixH){u.mixH.timeScale=u.mv?1.3:0;
        if(!u.mv&&u.actH)u.actH.time=.04;
        u.mixH.update(dt);}
      if(u.mixR){u.mixR.update(dt);
        const want=u.state==='attack'?'melee':'idle';
        if(want!==u.rCur&&u.rActs&&u.rActs[want]){
          const p=u.rActs[u.rCur],n=u.rActs[want];
          n.enabled=true;n.reset().play();
          if(p&&p!==n)p.crossFadeTo(n,.15,false);
          u.rCur=want;}}
      const rb=m.userData.rb;
      if(rb&&rb.ull){ // 騎姿：蓋過動畫嘅腳
        rb.ull.rotation.x=-1.25;rb.ull.rotation.z=.42;
        rb.ulr.rotation.x=-1.25;rb.ulr.rotation.z=-.42;
        rb.lll.rotation.x=1.35;rb.llr.rotation.x=1.35;
        if(rb.ftl){rb.ftl.rotation.x=-.35;rb.ftr.rotation.x=-.35;}}
      m.userData.body.position.y=u.mv?Math.abs(Math.sin(u.wt))*.05:0;
      if(m.userData.ring)m.userData.ring.visible=!!u.sel;
      continue;
    }
    if(m.userData.glb){
      if(u.mixer)u.mixer.update(dt);
      if(u.actions){
        let want='idle';
        if(u.mv)want=(u.sp>=150&&u.actions.run)?'run':'walk';
        else if(u.state==='attack')want=(u.type==='archer'||u.type==='mass_archer')?'shoot':'melee';
        else if(u.type==='villager'&&(u.state==='gathering'||u.state==='building'))want='melee';
        if(want!==u.cur&&u.actions[want]){
          const prev=u.actions[u.cur],next=u.actions[want];
          next.enabled=true;next.reset().play();
          if(prev&&prev!==next)prev.crossFadeTo(next,.16,false);
          u.cur=want;}
      }
      if(m.userData.carry)m.userData.carry.visible=u.ca>0;
      if(m.userData.ring)m.userData.ring.visible=!!u.sel;
      continue;
    }
    if(m.userData.cata){
      const cata=m.userData.cata;
      if(u.mv)cata.userData.wheels.forEach(w=>w.rotation.x+=dt*u.sp/S/.55);
      if(u.state==='attack'){const ph=Math.max(0,1-(u.at||0)/(u.cd||1));
        cata.userData.arm.rotation.x=ph<.15?(-.7+ph/.15*1.5):(.8-(ph-.15)/.85*1.5);}
      else cata.userData.arm.rotation.x=-.7;
      if(m.userData.ring)m.userData.ring.visible=!!u.sel;
      continue;
    }
    const body=m.userData.body,rig=m.userData.rig;
    const busy=(u.type==='villager'&&(u.state==='gathering'||u.state==='building'))||u.state==='attack';
    if(u.mv){
      const s=Math.sin(u.wt);
      body.position.y=Math.abs(s)*(m.userData.horse?.06:.09);
      body.rotation.x=m.userData.horse?0:.06;
      if(rig){
        if(!m.userData.rider){rig.legL.rotation.x=s*.65;rig.legR.rotation.x=-s*.65;}
        rig.armL.rotation.x=m.userData.rider?-.5:-s*.45;
        if(!busy)rig.armR.rotation.x=s*.45;
      }
      if(m.userData.horse)m.userData.horse.userData.legs.forEach((l,i)=>
        l.rotation.x=Math.sin(u.wt*1.5+((i===1||i===2)?Math.PI:0)+(i<2?0:.5))*.55);
    }else{
      body.position.y=0;body.rotation.x=0;
      if(rig){
        if(!m.userData.rider){rig.legL.rotation.x=0;rig.legR.rotation.x=0;}
        rig.armL.rotation.x=m.userData.rider?-.5:0;
      }
      if(m.userData.horse)m.userData.horse.userData.legs.forEach(l=>l.rotation.x=0);
    }
    if(rig){
      if(u.type==='villager'&&(u.state==='gathering'||u.state==='building')){
        rig.armR.rotation.x=-2.1+Math.abs(Math.sin(u.cs*Math.PI))*1.9;}
      else if(u.state==='attack'){const ph=Math.max(0,1-(u.at||0)/(u.cd||1));
        rig.armR.rotation.x=-1.8+ph*1.8;}
      else if(!u.mv)rig.armR.rotation.x=0;
    }
    if(m.userData.carry)m.userData.carry.visible=u.ca>0;
    if(m.userData.ring){m.userData.ring.visible=!!u.sel;}
  }
}
// ---- Overlay ----
function drawOverlay(){
  octx.clearRect(0,0,W,H);
  // 放置預覽 ghost：城牆顯示綠/紅格、清地顯示半徑圈
  if(placingType&&edgeMX>=0&&edgeMY>=0){
    const wp=sw(edgeMX,edgeMY);
    if(placingType==='wall'){
      const gx=Math.floor(wp.x/40)*40,gy=Math.floor(wp.y/40)*40;
      const ok=canPlace(gx,gy,40,40,'wall');
      const cs=[[gx,gy],[gx+40,gy],[gx+40,gy+40],[gx,gy+40]].map(([x,y])=>proj(x,y,.3));
      if(cs.every(p=>p.vis)){
        octx.beginPath();octx.moveTo(cs[0].x,cs[0].y);for(let i=1;i<4;i++)octx.lineTo(cs[i].x,cs[i].y);octx.closePath();
        octx.fillStyle=ok?'rgba(80,220,120,.3)':'rgba(220,70,70,.3)';octx.fill();
        octx.strokeStyle=ok?'#5ee07a':'#e04646';octx.lineWidth=2;octx.stroke();
      }
    }else if(placingType==='clear'){
      const c=proj(wp.x,wp.y,.3);
      if(c.vis){const r=proj(wp.x+58,wp.y,.3);const rad=Math.abs(r.x-c.x);
        octx.beginPath();octx.ellipse(c.x,c.y,rad,rad*.6,0,0,Math.PI*2);
        octx.fillStyle='rgba(220,180,80,.18)';octx.fill();
        octx.strokeStyle='#e0c050';octx.lineWidth=2;octx.setLineDash([6,4]);octx.stroke();octx.setLineDash([]);}
    }else if(BUILD_DEFS[placingType]){
      // 一般建築：cursor 做中心畫地基方框（綠=可放 / 紅=被擋）
      const def=BUILD_DEFS[placingType];
      const bx=wp.x-def.w/2,by=wp.y-def.h/2;
      const ok=canPlace(bx,by,def.w,def.h,placingType);
      const cs=[[bx,by],[bx+def.w,by],[bx+def.w,by+def.h],[bx,by+def.h]].map(([x,y])=>proj(x,y,.3));
      if(cs.every(p=>p.vis)){
        octx.beginPath();octx.moveTo(cs[0].x,cs[0].y);for(let i=1;i<4;i++)octx.lineTo(cs[i].x,cs[i].y);octx.closePath();
        octx.fillStyle=ok?'rgba(80,220,120,.28)':'rgba(220,70,70,.28)';octx.fill();
        octx.strokeStyle=ok?'#5ee07a':'#e04646';octx.lineWidth=2;octx.stroke();
      }
    }
  }
  for(const u of units){
    if(u.hp>=u.mh)continue;
    if(u.team!==MYTEAM&&!fogVisible(u.x,u.y))continue;
    const p=proj(u.x,u.y,(u.type==='horseman'||u.type==='knight')?3.6:2.8);if(!p.vis)continue;
    octx.fillStyle='rgba(0,0,0,.55)';octx.fillRect(p.x-15,p.y-4,30,5);
    const r=u.hp/u.mh;
    octx.fillStyle=r>.5?'#4a4':r>.25?'#da4':'#e33';
    octx.fillRect(p.x-14,p.y-3,28*r,3);}
  for(const b of buildings){
    if(!b.complete){
      const p=proj(b.x+b.w/2,b.y+b.h/2,4.5);if(!p.vis)continue;
      octx.fillStyle='rgba(0,0,0,.55)';octx.fillRect(p.x-20,p.y-4,40,6);
      octx.fillStyle='#ffd250';octx.fillRect(p.x-19,p.y-3,38*(b.p/b.bt),4);
    }else if(b.hp>0&&b.hp<b.maxHp){
      const p=proj(b.x+b.w/2,b.y+b.h/2,b.type==='castle_bldg'?13:5.5);if(!p.vis)continue;
      octx.fillStyle='rgba(0,0,0,.55)';octx.fillRect(p.x-20,p.y-4,40,5);
      const r=b.hp/b.maxHp;
      octx.fillStyle=r>.5?'#4a4':r>.25?'#da4':'#e33';
      octx.fillRect(p.x-19,p.y-3,38*r,3);}}
  for(const t of[tc,etc]){
    if(t.hp<t.mh&&t.hp>0){
      const p=proj(t.x+t.w/2,t.y+t.h/2,11.5);if(!p.vis)continue;
      octx.fillStyle='rgba(0,0,0,.55)';octx.fillRect(p.x-24,p.y-5,48,7);
      const r=t.hp/t.mh;
      octx.fillStyle=r>.5?'#4a4':r>.25?'#da4':'#e33';
      octx.fillRect(p.x-23,p.y-4,46*r,5);}}
  for(const f of fx){const p=proj(f.x,f.y,1.2);if(!p.vis)continue;
    octx.globalAlpha=Math.max(0,f.life);octx.fillStyle=f.c;
    octx.fillRect(p.x-f.sz/2,p.y-f.sz/2,f.sz,f.sz);}
  octx.globalAlpha=1;
  // waypoint 連線
  for(const u of units){if(!u.sel||!u.waypoints||!u.waypoints.length)continue;
    const pts=[{x:u.x,y:u.y},...u.waypoints];
    octx.strokeStyle='rgba(128,208,255,.7)';octx.lineWidth=1.2;octx.setLineDash([4,3]);octx.beginPath();
    const p0=proj(pts[0].x,pts[0].y,1);if(!p0.vis)continue;octx.moveTo(p0.x,p0.y);
    for(let i=1;i<pts.length;i++){const pi=proj(pts[i].x,pts[i].y,1);if(pi.vis)octx.lineTo(pi.x,pi.y);}
    octx.stroke();octx.setLineDash([]);
    // waypoint dot
    for(const wp of u.waypoints){const p=proj(wp.x,wp.y,1);if(p.vis){octx.fillStyle='#80d0ff';octx.beginPath();octx.arc(p.x,p.y,3,0,7);octx.fill();}}}
  if(bxSel&&bxR){octx.strokeStyle='#ffd250';octx.lineWidth=1.5;
    octx.setLineDash([6,4]);
    octx.strokeRect(Math.min(bxR.x1,bxR.x2),Math.min(bxR.y1,bxR.y2),
      Math.abs(bxR.x2-bxR.x1),Math.abs(bxR.y2-bxR.y1));
    octx.setLineDash([]);
    octx.fillStyle='rgba(255,210,80,.08)';
    octx.fillRect(Math.min(bxR.x1,bxR.x2),Math.min(bxR.y1,bxR.y2),
      Math.abs(bxR.x2-bxR.x1),Math.abs(bxR.y2-bxR.y1));}
}

function drawMinimap(){
  const sx=180/WORLD.w,sy=135/WORLD.h;
  mctx.fillStyle='#2e4a22';mctx.fillRect(0,0,180,135);
  for(const t of trees)if(t.res>0){mctx.fillStyle='#3f7d2c';mctx.fillRect(t.x*sx-1.5,t.y*sy-1.5,3,3);}
  for(const b of bushes)if(b.res>0){mctx.fillStyle='#c04050';mctx.fillRect(b.x*sx-1.5,b.y*sy-1.5,3,3);}
  for(const s of stones)if(s.res>0){mctx.fillStyle='#999';mctx.fillRect(s.x*sx-1.5,s.y*sy-1.5,3,3);}
  for(const g of goldMines)if(g.res>0){mctx.fillStyle='#f4d03f';mctx.fillRect(g.x*sx-1.5,g.y*sy-1.5,3,3);}
  if(tc.hp>0){mctx.fillStyle='#4a90e0';mctx.fillRect(tc.x*sx,tc.y*sy,tc.w*sx,tc.h*sy);}
  if(etc.hp>0){mctx.fillStyle='#d04040';mctx.fillRect(etc.x*sx,etc.y*sy,etc.w*sx,etc.h*sy);}
  for(const b of buildings){if(b.hp<=0&&b.complete)continue;
    mctx.fillStyle=b.team==='enemy'?'#a03030':'#3a78c0';
    mctx.fillRect(b.x*sx,b.y*sy,Math.max(2,b.w*sx),Math.max(2,b.h*sy));}
  for(const u of units){mctx.fillStyle=u.team==='enemy'?'#ff5050':u.type==='villager'?'#ffe080':'#60c0ff';
    mctx.fillRect(u.x*sx-1,u.y*sy-1,2.5,2.5);}
  mctx.strokeStyle='rgba(255,255,255,.7)';mctx.lineWidth=1;mctx.beginPath();
  const cs2=[[0,36],[W,36],[W,H-72],[0,H-72]];
  cs2.forEach(([cx,cy],i)=>{const w=sw(cx,cy);
    const px=Math.max(0,Math.min(180,w.x*sx)),py=Math.max(0,Math.min(135,w.y*sy));
    i===0?mctx.moveTo(px,py):mctx.lineTo(px,py);});
  mctx.closePath();mctx.stroke();
  // 攻擊警報紅點（3秒淡出）
  if(alertTimer>0){
    const alpha=Math.min(1,alertTimer/2.0);
    mctx.fillStyle=`rgba(255,40,40,${alpha})`;
    const ax=alertCX*180/WORLD.w,ay=alertCY*135/WORLD.h;
    const r=Math.max(4,10-alpha*6);
    mctx.beginPath();mctx.arc(ax,ay,r,0,7);mctx.fill();
  }
}

// 後備通道：同一部機/同瀏覽器嘅兩個分頁用 BroadcastChannel 直連
function bcSetup(id,role){
  if(!window.BroadcastChannel)return;
  mp.bc=new BroadcastChannel('rts3d-'+id);
  mp.bc.onmessage=ev=>{
    const m=ev.data;if(!m||m.from===role)return;
    if(role==='host'){
      // host 只認 guest 做對手；spectator 唔會 promote，但 host 照廣播快照畀佢
      if(!mp.ready&&m.from==='guest'){
        mp.via='bc';mp.send=d=>mp.bc.postMessage({from:'host',d});
        mpGo('host');}
      if(mp.via==='bc'&&m.from==='guest'&&m.d)hostRecv(m.d);
    }else if(role==='guest'){
      if(!mp.ready){mp.via='bc';mp.send=d=>mp.bc.postMessage({from:'guest',d});mpGo('guest');}
      if(mp.via==='bc'&&m.from==='host'&&m.d)guestRecv(m.d);
    }else{ // spectator：只收 host 廣播，render，唔發指令
      if(m.from==='host'&&m.d){
        if(!mp.ready){mp.ready=true;mp.via='bc';specGo();}
        guestRecv(m.d);}
    }
  };
  if(role==='guest'||role==='spectator'){
    mp.helloT=setInterval(()=>{
      if(mp.ready&&role==='guest'){clearInterval(mp.helloT);return;}
      mp.bc.postMessage({from:role,d:null});},400);
  }
}

  aStar,blockedSet,PF:()=>PF,PFG:()=>PFG,PFR:()=>PFR,
  ptick:dt=>{if(mp.ready&&(mp.role==='guest'||mp.role==='spectator'))guestTick(dt||.1);},
  setFog};
// ---- 主迴圈 ----
let last=performance.now();
function loop(){
  const now=performance.now();let dt=(now-last)/1000;last=now;
  dt=Math.min(dt,.05);
  if(W!==innerWidth||H!==innerHeight)resize();
  updateCamera();
  if(mp.ready&&(mp.role==='guest'||mp.role==='spectator'))guestTick(dt);else update(dt);
  updateDayNight();
  syncScene(dt,now);
  updateFog(dt);redrawFogTex();applyFog();
  renderer.render(scene,camera);
  drawOverlay();
  drawMinimap();drawFogMini();
  requestAnimationFrame(loop);
}
loop();
</script>
