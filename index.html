<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTS</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1a1a;font-family:sans-serif;}
  #c{display:block;cursor:crosshair;}
  #topbar{position:fixed;top:0;left:0;right:0;height:36px;background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;gap:32px;
    color:#fff;font-size:14px;font-weight:bold;pointer-events:none;border-bottom:1px solid #444;z-index:5;}
  #hud{position:fixed;top:44px;left:8px;color:#ccc;font-size:12px;
       background:rgba(0,0,0,.55);padding:6px 10px;border-radius:7px;line-height:1.9;pointer-events:none;z-index:5;}
  #status{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);
    color:#ffd250;font-size:13px;font-weight:bold;pointer-events:none;
    background:rgba(0,0,0,.5);padding:4px 14px;border-radius:20px;
    opacity:0;transition:opacity .3s;z-index:10;}
  #bmenu{position:fixed;bottom:0;left:0;right:0;height:64px;
    background:rgba(12,12,12,.85);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;gap:10px;
    border-top:2px solid #555;z-index:10;padding:0 12px;}
  #bmenu.show{display:flex;}
  #bmenu button{background:rgba(55,55,55,.9);border:2px solid #666;color:#eee;
    font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;
    font-weight:bold;font-family:sans-serif;transition:all .12s;white-space:nowrap;}
  #bmenu button:hover:not(:disabled){border-color:#ffd250;background:rgba(75,75,75,.9);transform:scale(1.04);}
  #bmenu button:disabled{opacity:.3;cursor:not-allowed;border-color:#444;transform:none;}
  #bmenu .label{color:#aaa;font-size:13px;padding:0 10px;font-weight:bold;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topbar">
  <span>🪵 木材：<b id="wood">0</b></span>
  <span>🍓 食物：<b id="food">0</b></span>
  <span>👥 <b id="pop">3</b>/<b id="popCap">5</b></span>
</div>
<div id="hud">
  <b>點</b>村民選取 ／ <b>拖曳</b>框選多人<br>
  選取村民後：下方選單可<b>蓋建築</b><br>
  點樹🌳採木 ／ 點莓果🍓採食物<br>
  點地面 → 移動 ｜ <b>A</b> → 全選<br>
  兩指滑動：移動鏡頭 ｜ 捏合：縮放
</div>
<div id="status"></div>
<div id="bmenu"></div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize',resize); resize();

const WORLD={w:2400,h:1800,tile:80};
const cam={x:WORLD.w/2-640, y:WORLD.h/2-400, zoom:1};
function sw(sx,sy){ return {x:cam.x+sx/cam.zoom, y:cam.y+sy/cam.zoom}; }

// ---- 資源 ----
let wood=0, food=0;
const woodEl=document.getElementById('wood'), foodEl=document.getElementById('food');
const popEl=document.getElementById('pop'), popCapEl=document.getElementById('popCap');
const statusEl=document.getElementById('status');
let statusTimer=0;
function showStatus(msg){ statusEl.textContent=msg; statusEl.style.opacity=1; statusTimer=2.5; }

// ---- 人口與建築定義 ----
let popCap=5;
function popCount(){ return villagers.length; }
function updatePopDisp(){ popEl.textContent=villagers.length; popCapEl.textContent=popCap; }

const BUILD_DEFS={
  house:{name:'房屋',w:76,h:66,hp:200,cost:{wood:30},buildTime:5,popBonus:5},
  barracks:{name:'兵營',w:86,h:78,hp:400,cost:{wood:50,food:20},buildTime:8,popBonus:0},
};
const buildings=[];
let selectedBldg=null; // {type:'tc'} 或建築物件

function canPlace(x,y,bw,bh){
  if(x<20||y<20||x+bw>WORLD.w-20||y+bh>WORLD.h-20) return false;
  if(x<tc.x+tc.w+20&&x+bw>tc.x-20&&y<tc.y+tc.h+20&&y+bh>tc.y-20) return false;
  for(const t of trees){
    if(t.x>x-12&&t.x<x+bw+12&&t.y>y-12&&t.y<y+bh+12) return false;
  }
  for(const b of buildings){
    if(b.x<x+bw+15&&b.x+b.w>x-15&&b.y<y+bh+15&&b.y+b.h>y-15) return false;
  }
  return true;
}
function findBuildSpot(cx,cy,bw,bh){
  const offs=[
    {dx:0,dy:0},{dx:-130,dy:0},{dx:130,dy:0},{dx:0,dy:-120},{dx:0,dy:120},
    {dx:-150,dy:-110},{dx:150,dy:-110},{dx:-150,dy:110},{dx:150,dy:110},
    {dx:-220,dy:0},{dx:220,dy:0},{dx:0,dy:-190},{dx:0,dy:190},
  ];
  for(const {dx,dy} of offs){
    const x=cx+dx-bw/2, y=cy+dy-bh/2;
    if(canPlace(x,y,bw,bh)) return {x,y};
  }
  return null;
}

function startBuild(type){
  const def=BUILD_DEFS[type]; if(!def) return;
  const sel=selected(); if(!sel.length){ showStatus('請先選取村民'); return; }
  if(def.cost.wood&&wood<def.cost.wood){ showStatus('木材不足'); return; }
  if(def.cost.food&&food<def.cost.food){ showStatus('食物不足'); return; }
  const ax=sel.reduce((s,v)=>s+v.x,0)/sel.length;
  const ay=sel.reduce((s,v)=>s+v.y,0)/sel.length;
  const spot=findBuildSpot(ax,ay,def.w,def.h);
  if(!spot){ showStatus('找不到空地建'+def.name); return; }
  if(def.cost.wood) wood-=def.cost.wood;
  if(def.cost.food) food-=def.cost.food;
  woodEl.textContent=wood; foodEl.textContent=food;
  const bldg={x:spot.x,y:spot.y,w:def.w,h:def.h,type,
    hp:1,maxHp:def.hp,name:def.name,
    buildProgress:0,buildTime:def.buildTime,complete:false,popBonus:def.popBonus};
  buildings.push(bldg);
  sel.forEach((v,i)=>{
    const row=Math.floor(i/2),col=i%2;
    v.state='building'; v.targetRes=null; v.gatherType=null;
    v.tx=spot.x+10+col*30; v.ty=spot.y-15-row*28;
    v.targetBldg=bldg;
  });
  playClick(); showStatus('開始建造'+def.name);
}

function trainVillager(){
  if(food<50){ showStatus('食物不足（需要50）'); return; }
  if(villagers.length>=popCap){ showStatus('人口已滿！'); return; }
  food-=50; foodEl.textContent=food;
  const c={x:tc.x+tc.w/2,y:tc.y+tc.h/2};
  const v=makeVillager(c.x-12+Math.random()*24, c.y+tc.h/2+5, villagers.length);
  v.tx=c.x; v.ty=c.y+tc.h+60; v.state='moving';
  villagers.push(v);
  updatePopDisp();
  playDrop(); spawnFx(c.x,c.y+tc.h,'#80ff80',10);
  showStatus('👤 新村民出發！');
}

// ---- 主堡 ----
const tc={x:WORLD.w/2-280, y:WORLD.h/2-40, w:100, h:100};
function tcCenter(){ return {x:tc.x+tc.w/2, y:tc.y+tc.h/2}; }

// ---- 樹木 ----
const TREE_R=22;
const trees=[];
(function(){
  const zones=[
    [tc.x+180,tc.y-180,480,380],[tc.x+360,tc.y+130,380,320],
    [100,100,580,580],[WORLD.w-700,100,580,680],
    [100,WORLD.h-700,680,580],[WORLD.w-600,WORLD.h-600,480,480],
    [WORLD.w/2-80,80,380,380],
  ];
  for(const [bx,by,bw,bh] of zones){
    for(let i=0;i<4+Math.floor(Math.random()*4);i++){
      let ok=false,x,y,tries=0;
      while(!ok&&tries++<30){
        x=bx+Math.random()*bw; y=by+Math.random()*bh;
        if(x<20||y<20||x>WORLD.w-20||y>WORLD.h-20) continue;
        if(Math.hypot(x-(tc.x+50),y-(tc.y+50))<150) continue;
        ok=trees.every(t=>Math.hypot(t.x-x,t.y-y)>TREE_R*2.2);
      }
      if(ok) trees.push({x,y,r:TREE_R,res:80,maxRes:80,type:'wood',shakeT:0});
    }
  }
})();

// ---- 莓果叢 ----
const BUSH_R=18;
const bushes=[];
(function(){
  const zones=[
    [tc.x+100,tc.y+80,300,250],[tc.x-250,tc.y-150,280,280],
    [WORLD.w/2+200,WORLD.h/2+200,400,350],
    [200,WORLD.h-500,400,380],[WORLD.w-500,WORLD.h/2-100,380,320],
  ];
  for(const [bx,by,bw,bh] of zones){
    for(let i=0;i<3+Math.floor(Math.random()*3);i++){
      let ok=false,x,y,tries=0;
      while(!ok&&tries++<30){
        x=bx+Math.random()*bw; y=by+Math.random()*bh;
        if(x<20||y<20||x>WORLD.w-20||y>WORLD.h-20) continue;
        if(Math.hypot(x-(tc.x+50),y-(tc.y+50))<120) continue;
        const allRes=[...trees,...bushes];
        ok=allRes.every(t=>Math.hypot(t.x-x,t.y-y)>BUSH_R*2.5);
      }
      if(ok) bushes.push({x,y,r:BUSH_R,res:60,maxRes:60,type:'food',shakeT:0});
    }
  }
})();

// ---- 村民工廠 ----
const HATS=['#8b5a2b','#5a3a8b','#2b6a5a'];
function makeVillager(x,y,idx){
  return {x,y,tx:x,ty:y,speed:150,walkT:0,moving:false,
    state:'idle', targetRes:null, gatherType:null,
    carryAmt:0, carryMax:15,
    gatherTimer:0, gatherInterval:0.4, chopSwing:0,
    selected:false, idx,
    targetBldg:null,
    hatColor:HATS[idx%HATS.length]};
}
const villagers=[
  makeVillager(tc.x+tc.w/2-30, tc.y+tc.h+30, 0),
  makeVillager(tc.x+tc.w/2,    tc.y+tc.h+30, 1),
  makeVillager(tc.x+tc.w/2+30, tc.y+tc.h+30, 2),
];
function selected(){ return villagers.filter(v=>v.selected); }

// ---- 音效 ----
const AC=new (window.AudioContext||window.webkitAudioContext)();
addEventListener('mousedown',()=>{ if(AC.state==='suspended') AC.resume(); },{once:false});
function playChop(){
  const len=AC.sampleRate*.08, buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=350; f.Q.value=0.8;
  const g=AC.createGain(); g.gain.setValueAtTime(0.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+.08);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  const o=AC.createOscillator(),og=AC.createGain();
  o.frequency.setValueAtTime(140,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(60,AC.currentTime+.06);
  og.gain.setValueAtTime(0.35,AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+.07);
  o.connect(og); og.connect(AC.destination); o.start(); o.stop(AC.currentTime+.07);
}
function playPick(){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(600,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(300,AC.currentTime+.08);
  g.gain.setValueAtTime(0.2,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+.1);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+.1);
}
function playDrop(){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(880,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(440,AC.currentTime+.12);
  g.gain.setValueAtTime(0.22,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+.2);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+.2);
}
function playClick(){
  const len=Math.floor(AC.sampleRate*.03);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1200;
  const g=AC.createGain(); g.gain.value=0.28;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}

// ---- 特效 ----
const fx=[];
function spawnFx(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=30+Math.random()*60;
    fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:3});
  }
}
function spawnChips(res, vil){
  const dir=Math.atan2(vil.y-res.y, vil.x-res.x);
  const color=res.type==='wood'?'#c8a030':'#e05050';
  for(let i=0;i<6;i++){
    const a=dir+(-0.8+Math.random()*1.6), s=50+Math.random()*80;
    fx.push({x:res.x,y:res.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:4});
  }
  for(let i=0;i<3;i++){
    const a=Math.random()*Math.PI*2, s=20+Math.random()*40;
    const leaf=res.type==='wood'?'#4a9a3a':'#c83040';
    fx.push({x:res.x,y:res.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.8,color:leaf,size:3});
  }
}

// ---- 輸入 ----
let mouseDown=null, boxSelecting=false, boxRect=null, dragMoved=false;

function edgeOf(res, vil){
  const dx=(vil.x-res.x)||0.001, dy=(vil.y-res.y)||0.001;
  const d=Math.hypot(dx,dy);
  return {x:res.x+dx/d*(res.r+18), y:res.y+dy/d*(res.r+18)};
}

function issueCommand(wx,wy){
  const sel=selected(); if(!sel.length) return;
  selectedBldg=null;
  const hitTree=trees.find(t=>t.res>0&&Math.hypot(t.x-wx,t.y-wy)<t.r+12);
  const hitBush=bushes.find(b=>b.res>0&&Math.hypot(b.x-wx,b.y-wy)<b.r+12);
  const hitRes=hitTree||hitBush;

  if(hitRes){
    const pool=(hitRes.type==='wood'?trees:bushes)
      .filter(r=>r.res>0)
      .sort((a,b)=>Math.hypot(a.x-wx,a.y-wy)-Math.hypot(b.x-wx,b.y-wy));
    sel.forEach((vil,i)=>{
      const target=pool[i%pool.length];
      vil.targetRes=target; vil.gatherType=target.type; vil.state='moving'; vil.targetBldg=null;
      const e=edgeOf(target,vil); vil.tx=e.x; vil.ty=e.y;
    });
    showStatus(sel.length>1?`${sel.length} 人分頭採集！`:'前往採集');
  } else {
    sel.forEach((vil,i)=>{
      const row=Math.floor(i/3), col=i%3;
      vil.targetRes=null; vil.gatherType=null; vil.state='moving'; vil.targetBldg=null;
      vil.tx=wx+(col-1)*28; vil.ty=wy+row*28;
    });
  }
  playClick();
  spawnFx(wx,wy,hitRes?'#80ff80':'#ffd250',6);
}

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  const w=sw(e.clientX,e.clientY);
  mouseDown={sx:e.clientX,sy:e.clientY,wx:w.x,wy:w.y};
  dragMoved=false; boxSelecting=false;
});

addEventListener('mousemove',e=>{
  if(!mouseDown) return;
  const dx=e.clientX-mouseDown.sx, dy=e.clientY-mouseDown.sy;
  if(Math.abs(dx)+Math.abs(dy)>6){
    dragMoved=true; boxSelecting=true;
    const w=sw(e.clientX,e.clientY);
    boxRect={x1:mouseDown.wx,y1:mouseDown.wy,x2:w.x,y2:w.y};
  }
});

addEventListener('mouseup',e=>{
  if(e.button!==0||!mouseDown) return;
  const w=sw(e.clientX,e.clientY);
  if(boxSelecting && boxRect){
    const minX=Math.min(boxRect.x1,boxRect.x2), maxX=Math.max(boxRect.x1,boxRect.x2);
    const minY=Math.min(boxRect.y1,boxRect.y2), maxY=Math.max(boxRect.y1,boxRect.y2);
    const hit=villagers.filter(v=>v.x>=minX&&v.x<=maxX&&v.y>=minY&&v.y<=maxY);
    if(hit.length){
      villagers.forEach(v=>v.selected=false);
      selectedBldg=null;
      hit.forEach(v=>v.selected=true);
      showStatus(`已選取 ${hit.length} 個村民`);
    }
  } else if(!dragMoved){
    // 單擊
    const hitVil=villagers.find(v=>Math.hypot(v.x-w.x,v.y-w.y)<18);
    const anySel=selected().length>0;
    if(hitVil){
      villagers.forEach(v=>v.selected=false);
      selectedBldg=null;
      hitVil.selected=true;
      showStatus('已選取村民');
    } else if(anySel){
      // 有選村民時，檢查是否按到主堡／建築
      const tcHit=w.x>=tc.x&&w.x<=tc.x+tc.w&&w.y>=tc.y&&w.y<=tc.y+tc.h;
      const hitBldg=buildings.find(b=>b.complete&&w.x>=b.x&&w.x<=b.x+b.w&&w.y>=b.y&&w.y<=b.y+b.h);
      if(tcHit){
        villagers.forEach(v=>v.selected=false);
        selectedBldg={type:'tc',name:'主堡'};
        showStatus('選取主堡 — 可生產村民');
      } else if(hitBldg){
        villagers.forEach(v=>v.selected=false);
        selectedBldg=hitBldg;
        showStatus('選取'+hitBldg.name);
      } else {
        issueCommand(w.x,w.y);
      }
    } else {
      villagers.forEach(v=>v.selected=false);
      const tcHit=w.x>=tc.x&&w.x<=tc.x+tc.w&&w.y>=tc.y&&w.y<=tc.y+tc.h;
      const hitBldg=buildings.find(b=>b.complete&&w.x>=b.x&&w.x<=b.x+b.w&&w.y>=b.y&&w.y<=b.y+b.h);
      if(tcHit){
        selectedBldg={type:'tc',name:'主堡'};
        showStatus('選取主堡 — 可生產村民');
      } else if(hitBldg){
        selectedBldg=hitBldg;
        showStatus('選取'+hitBldg.name);
      } else {
        selectedBldg=null;
      }
    }
  }
  mouseDown=null; boxSelecting=false; boxRect=null; dragMoved=false;
});

// 右鍵也能下令（選取後）
canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(!selected().length) return;
  const w=sw(e.clientX,e.clientY);
  issueCommand(w.x,w.y);
});

// 兩指滑動=平移，捏合(ctrlKey)=縮放
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey){
    const before=sw(e.clientX,e.clientY);
    const f=e.deltaY<0?1.08:0.93;
    cam.zoom=Math.min(2.5,Math.max(0.35,cam.zoom*f));
    const after=sw(e.clientX,e.clientY);
    cam.x+=before.x-after.x; cam.y+=before.y-after.y;
  } else {
    cam.x+=e.deltaX/cam.zoom; cam.y+=e.deltaY/cam.zoom;
  }
},{passive:false});

addEventListener('keydown',e=>{
  if(e.key==='a'||e.key==='A'){
    selectedBldg=null;
    villagers.forEach(v=>v.selected=true);
    showStatus(`全選 ${villagers.length} 個村民`);
  }
  if(e.key==='Escape'){
    villagers.forEach(v=>v.selected=false);
    selectedBldg=null;
    showStatus('取消選取');
  }
});

// ---- 更新單一村民 ----
function updateVil(v,dt){
  const dx=v.tx-v.x, dy=v.ty-v.y, dist=Math.hypot(dx,dy);
  if(dist>2){
    v.moving=true;
    const step=Math.min(dist,v.speed*dt);
    v.x+=dx/dist*step; v.y+=dy/dist*step;
    v.walkT+=dt*8;
  } else {
    v.moving=false; v.x=v.tx; v.y=v.ty;
    if(v.state==='moving'){
      if(v.targetRes&&v.targetRes.res>0) v.state='gathering';
      else if(!v.targetRes) v.state='idle';
    }
    if(v.state==='returning'){
      if(v.gatherType==='wood'){ wood+=v.carryAmt; woodEl.textContent=wood; }
      else                      { food+=v.carryAmt; foodEl.textContent=food; }
      playDrop(); spawnFx(v.x,v.y,'#ffd250',6);
      v.carryAmt=0;
      const pool=v.gatherType==='wood'?trees:bushes;
      const next=(v.targetRes&&v.targetRes.res>0)
        ? v.targetRes
        : pool.filter(r=>r.res>0).sort((a,b)=>Math.hypot(a.x-v.x,a.y-v.y)-Math.hypot(b.x-v.x,b.y-v.y))[0];
      if(next){ v.targetRes=next; const e=edgeOf(next,v); v.tx=e.x; v.ty=e.y; v.state='moving'; }
      else { v.state='idle'; v.targetRes=null; }
    }
    if(v.state==='building'&&v.targetBldg){
      const b=v.targetBldg;
      if(!b.complete){
        b.buildProgress+=dt;
        // 鋸木動畫
        v.chopSwing=Math.sin(performance.now()/200)*0.5+0.5;
        if(b.buildProgress>=b.buildTime){
          b.complete=true; b.hp=b.maxHp;
          if(b.type==='house') popCap+=b.popBonus;
          updatePopDisp();
          playDrop(); spawnFx(b.x+b.w/2,b.y+b.h/2,'#ffd250',16);
          showStatus(b.name+'建造完成！');
          v.state='idle'; v.targetBldg=null;
        }
      } else {
        v.state='idle'; v.targetBldg=null;
      }
    }
  }

  if(v.state==='gathering'&&v.targetRes){
    const t=v.targetRes;
    if(t.res<=0){
      v.chopSwing=0;
      if(v.carryAmt>0){
        v.state='returning'; const c=tcCenter(); v.tx=c.x; v.ty=c.y;
      } else {
        const pool=v.gatherType==='wood'?trees:bushes;
        const next=pool.filter(r=>r.res>0).sort((a,b)=>Math.hypot(a.x-v.x,a.y-v.y)-Math.hypot(b.x-v.x,b.y-v.y))[0];
        if(next){ v.targetRes=next; const e=edgeOf(next,v); v.tx=e.x; v.ty=e.y; v.state='moving'; }
        else { v.state='idle'; v.targetRes=null; }
      }
    }
    else {
      v.gatherTimer+=dt;
      v.chopSwing=(v.gatherTimer/v.gatherInterval)%1;
      if(v.gatherTimer>=v.gatherInterval){
        v.gatherTimer=0;
        const amt=Math.min(2,t.res);
        t.res-=amt; v.carryAmt+=amt;
        spawnChips(t,v); t.shakeT=0.15;
        if(t.type==='wood') playChop(); else playPick();
        if(v.carryAmt>=v.carryMax){
          const c=tcCenter(); v.tx=c.x; v.ty=c.y; v.state='returning'; v.chopSwing=0;
        }
      }
      if(t.shakeT>0) t.shakeT-=dt;
    }
  } else { v.chopSwing=0; }
}

// ---- 更新 ----
let last=performance.now();
function update(dt){
  villagers.forEach(v=>updateVil(v,dt));
  // 自動解除已完工的建築工人
  for(const v of villagers){
    if(v.state==='building'&&v.targetBldg&&v.targetBldg.complete){
      v.state='idle'; v.targetBldg=null;
    }
  }
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.82; p.vy*=.82; p.life-=dt*2.5;
    if(p.life<=0) fx.splice(i,1);
  }
  if(statusTimer>0){ statusTimer-=dt; if(statusTimer<=0) statusEl.style.opacity=0; }
  updatePopDisp();
  renderBuildMenu();
}

// ---- 底部建造選單 ----
function renderBuildMenu(){
  const menu=document.getElementById('bmenu');
  const sel=selected();
  if(sel.length){
    const canHouse=wood>=30;
    const canBarracks=wood>=50&&food>=20;
    menu.style.display='flex';
    menu.innerHTML=`
      <button onclick="startBuild('house')" ${canHouse?'':'disabled'}>
        🏠 建房屋 <span style="color:#c8a030;font-size:11px">🪵30</span>
      </button>
      <button onclick="startBuild('barracks')" ${canBarracks?'':'disabled'}>
        ⚔️ 建兵營 <span style="color:#c8a030;font-size:11px">🪵50</span><span style="color:#e06060;font-size:11px">🍓20</span>
      </button>`;
  } else if(selectedBldg && selectedBldg.type==='tc'){
    const canTrain=food>=50 && villagers.length<popCap;
    menu.style.display='flex';
    menu.innerHTML=`
      <span class="label">🏰 主堡</span>
      <button onclick="trainVillager()" ${canTrain?'':'disabled'}>
        👤 生產村民 <span style="color:#e06060;font-size:11px">🍓50</span>
      </button>`;
  } else if(selectedBldg && selectedBldg.complete){
    const icon=selectedBldg.type==='house'?'🏠':'⚔️';
    const info=selectedBldg.type==='house'?`<span class="label">人口 +${selectedBldg.popBonus}</span>`:'';
    menu.style.display='flex';
    menu.innerHTML=`<span class="label">${icon} ${selectedBldg.name}</span>${info}`;
  } else {
    menu.style.display='none';
  }
}

// ---- 繪製村民 ----
function drawVillager(v){
  const {x,y,moving,walkT,carryAmt,gatherType,chopSwing,selected:sel,hatColor}=v;
  const carrying=carryAmt>0;
  const chopping=chopSwing>0;
  ctx.save(); ctx.translate(x,y);
  if(sel){
    ctx.strokeStyle='#ffd250'; ctx.lineWidth=2; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.arc(0,8,22,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  const swing=moving?Math.sin(walkT)*0.18:0;
  ctx.rotate(swing);
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(0,14,10,4,0,0,Math.PI*2); ctx.fill();
  const ls=moving?Math.sin(walkT)*5:0;
  for(const [sx,ss] of [[-4,1],[4,-1]]){
    ctx.save(); ctx.translate(sx,8); ctx.rotate(ls*ss*Math.PI/180);
    ctx.fillStyle='#5a3e2b'; ctx.fillRect(-2.5,0,5,9);
    ctx.fillStyle='#3b2a1a'; ctx.fillRect(-3,8,6,3); ctx.restore();
  }
  ctx.fillStyle='#c8a96e'; ctx.beginPath(); ctx.roundRect(-7,-2,14,12,2); ctx.fill();
  ctx.fillStyle='#b0925c'; ctx.fillRect(-1,-1,2,10);
  const as=moving?Math.sin(walkT)*5:0;
  ctx.save(); ctx.translate(-8,1); ctx.rotate(-as*Math.PI/180);
  ctx.fillStyle='#c8a96e'; ctx.fillRect(-2.5,0,5,8);
  ctx.fillStyle='#d4956a'; ctx.beginPath(); ctx.arc(0,9,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(8,1);
  const axeRot=chopping?(Math.sin(chopSwing*Math.PI)*-1.8-.3):as*Math.PI/180;
  ctx.rotate(axeRot);
  ctx.fillStyle='#c8a96e'; ctx.fillRect(-2.5,0,5,8);
  if(carrying && gatherType==='food'){
    ctx.fillStyle='#e06060'; ctx.beginPath(); ctx.arc(2,10,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff8080'; ctx.beginPath(); ctx.arc(0,8,3,0,Math.PI*2); ctx.fill();
  } else if(carrying){
    ctx.fillStyle='#8b5a2b'; ctx.fillRect(-2,8,10,5);
    ctx.fillStyle='#a0704a'; ctx.fillRect(-1,9,8,3);
    ctx.strokeStyle='#5a3010'; ctx.lineWidth=1; ctx.strokeRect(-2,8,10,5);
  } else {
    ctx.strokeStyle='#6b4c2a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(2,18); ctx.stroke();
    if(chopping){
      ctx.fillStyle='#ddd';
      ctx.beginPath(); ctx.moveTo(1,10); ctx.lineTo(9,6); ctx.lineTo(8,14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,255,150,.6)'; ctx.lineWidth=1; ctx.stroke();
    } else {
      ctx.fillStyle='#aaa'; ctx.beginPath();
      ctx.moveTo(2,12); ctx.lineTo(6,10); ctx.lineTo(5,15); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  ctx.fillStyle='#d4956a'; ctx.fillRect(-3,-5,6,5);
  ctx.beginPath(); ctx.ellipse(0,-12,8,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1a0a';
  ctx.beginPath(); ctx.arc(-3,-13,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3,-13,1.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7a4020'; ctx.lineWidth=1.2; ctx.beginPath();
  moving?ctx.arc(0,-10,2.5,.2,Math.PI-.2):ctx.arc(0,-11,2,.3,Math.PI-.3);
  ctx.stroke();
  ctx.fillStyle=hatColor;
  ctx.beginPath(); ctx.moveTo(-10,-17); ctx.lineTo(10,-17); ctx.lineTo(6,-27); ctx.lineTo(-6,-27); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(-11,-19,22,3);
  ctx.restore();
}

// ---- 繪製樹木 ----
function drawTree(t){
  if(t.res<=0){
    ctx.fillStyle='#7a5030'; ctx.beginPath(); ctx.ellipse(t.x,t.y+2,8,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9a6840'; ctx.beginPath(); ctx.ellipse(t.x,t.y,7,4,0,0,Math.PI*2); ctx.fill();
    return;
  }
  const ratio=t.res/t.maxRes, r=t.r*(0.6+0.4*ratio);
  const shake=t.shakeT>0?(Math.random()-.5)*5*(t.shakeT/.15):0;
  const tx=t.x+shake;
  ctx.fillStyle='#7a5030'; ctx.beginPath(); ctx.ellipse(tx,t.y+r*.6,r*.35,r*.45,0,0,Math.PI*2); ctx.fill();
  for(const [ox,oy,or,c] of [[-r*.25,r*.15,r*.7,'#2d6a2d'],[r*.2,r*.1,r*.65,'#2e7a2e'],[0,-r*.1,r*.8,'#3a8a3a'],[-r*.1,-r*.3,r*.6,'#4a9a3a']]){
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(tx+ox,t.y+oy,or,0,Math.PI*2); ctx.fill();
  }
  if(ratio<0.6){
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(t.x-16,t.y-t.r-10,32,5);
    ctx.fillStyle=ratio>.35?'#6dcc30':'#e06020';
    ctx.fillRect(t.x-16,t.y-t.r-10,32*ratio,5);
  }
}

// ---- 繪製莓果叢 ----
function drawBush(b){
  if(b.res<=0){
    ctx.fillStyle='#5a7040'; ctx.beginPath(); ctx.ellipse(b.x,b.y,8,5,0,0,Math.PI*2); ctx.fill();
    return;
  }
  const ratio=b.res/b.maxRes, r=b.r*(0.5+0.5*ratio);
  const shake=b.shakeT>0?(Math.random()-.5)*4*(b.shakeT/.15):0;
  const bx=b.x+shake;
  for(const [ox,oy,or,c] of [[0,0,r,'#4a7a30'],[-r*.4,r*.1,r*.7,'#3a6a25'],[r*.35,r*.05,r*.65,'#3d7028'],[0,-r*.25,r*.6,'#5a8a35']]){
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(bx+ox,b.y+oy,or,0,Math.PI*2); ctx.fill();
  }
  const berryCount=Math.ceil(ratio*8);
  const berryPositions=[[-r*.3,-r*.1],[r*.25,-r*.15],[0,r*.1],[r*.1,-r*.3],[-r*.15,r*.2],[r*.3,r*.1],[-r*.05,-r*.25],[r*.2,r*.25]];
  ctx.fillStyle='#e03040';
  for(let i=0;i<berryCount;i++){
    const [ox,oy]=berryPositions[i];
    ctx.beginPath(); ctx.arc(bx+ox,b.y+oy,3,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#ff6070';
  for(let i=0;i<Math.ceil(berryCount/2);i++){
    const [ox,oy]=berryPositions[i];
    ctx.beginPath(); ctx.arc(bx+ox+1,b.y+oy-1,1.5,0,Math.PI*2); ctx.fill();
  }
  if(ratio<0.6){
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(b.x-14,b.y-b.r-10,28,4);
    ctx.fillStyle='#e04040'; ctx.fillRect(b.x-14,b.y-b.r-10,28*ratio,4);
  }
}

// ---- 繪製主堡 ----
function drawTC(){
  const {x,y,w,h}=tc;
  ctx.fillStyle='#7a6040'; ctx.fillRect(x-4,y-4,w+8,h+8);
  ctx.fillStyle='#c8b080'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#9a3030';
  ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+w/2,y-40); ctx.lineTo(x+w+8,y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#6b3a1a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x+w/2,y-40); ctx.lineTo(x+w/2,y-70); ctx.stroke();
  ctx.fillStyle='#e04030';
  ctx.beginPath(); ctx.moveTo(x+w/2,y-70); ctx.lineTo(x+w/2+18,y-62); ctx.lineTo(x+w/2,y-54); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5a3010'; ctx.beginPath(); ctx.roundRect(x+w/2-12,y+h-30,24,30,4); ctx.fill();
  ctx.fillStyle='rgba(255,220,100,.4)';
  ctx.beginPath(); ctx.arc(x+22,y+25,8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w-22,y+25,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('主堡',x+w/2,y-6);
  // 選取光環
  if(selectedBldg && selectedBldg.type==='tc'){
    ctx.strokeStyle='#ffd250'; ctx.lineWidth=2; ctx.setLineDash([5,3]);
    ctx.strokeRect(x-5,y-5,w+10,h+10); ctx.setLineDash([]);
  }
}

// ---- 繪製建築 ----
function drawBuildProgress(x,y,w,pct){
  const barW=w-10, barH=6, bx=x+5, by=y-14;
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(bx-1,by-1,barW+2,barH+2,3); ctx.fill();
  ctx.fillStyle='#4a9a3a'; ctx.beginPath(); ctx.roundRect(bx,by,barW*pct,barH,2); ctx.fill();
  if(pct<1){
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(bx+Math.max(barW*pct-6,0),by,6,barH);
  }
}

function drawBuilding(b){
  const {x,y,w,h,type,complete,buildProgress,buildTime}=b;
  if(!complete){
    const pct=Math.min(1,buildProgress/buildTime);
    ctx.save();
    ctx.globalAlpha=0.35+0.5*pct;
    // 地基
    ctx.fillStyle='#6b5a3a'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#8a7a5a';
    ctx.fillRect(x+4,y+4,(w-8)*pct,h-8);
    ctx.strokeStyle='#9a8040'; ctx.lineWidth=1.5;
    ctx.strokeRect(x,y,w,h);
    // 鷹架
    ctx.strokeStyle='#7a6030'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+8,y); ctx.lineTo(x+8,y+h);
    ctx.moveTo(x+w-8,y); ctx.lineTo(x+w-8,y+h);
    ctx.moveTo(x,y+8); ctx.lineTo(x+w,y+8);
    ctx.moveTo(x,y+h-8); ctx.lineTo(x+w,y+h-8);
    ctx.stroke();
    ctx.globalAlpha=1;
    drawBuildProgress(x,y,w,pct);
    ctx.restore();
    return;
  }
  // 已完工
  ctx.save();
  if(selectedBldg===b){
    ctx.strokeStyle='#ffd250'; ctx.lineWidth=2; ctx.setLineDash([5,3]);
    ctx.strokeRect(x-4,y-4,w+8,h+8); ctx.setLineDash([]);
  }
  if(type==='house') drawHouseBuilding(b);
  else if(type==='barracks') drawBarracksBuilding(b);
  ctx.restore();
}

function drawHouseBuilding(b){
  const {x,y,w,h}=b;
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h-4,w/2+4,5,0,0,Math.PI*2); ctx.fill();
  // 牆壁
  ctx.fillStyle='#b8a060'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#8a7030'; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);
  // 屋頂
  ctx.fillStyle='#8a3030';
  ctx.beginPath(); ctx.moveTo(x-5,y); ctx.lineTo(x+w/2,y-28); ctx.lineTo(x+w+5,y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#5a2020'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-5,y); ctx.lineTo(x+w/2,y-28); ctx.lineTo(x+w+5,y); ctx.stroke();
  // 門
  ctx.fillStyle='#5a3010'; ctx.beginPath(); ctx.roundRect(x+w/2-8,y+h-22,16,22,3); ctx.fill();
  ctx.fillStyle='#c8b040'; ctx.beginPath(); ctx.arc(x+w/2+2,y+h-11,2,0,Math.PI*2); ctx.fill();
  // 窗
  ctx.fillStyle='#6ab0d0'; ctx.beginPath(); ctx.roundRect(x+12,y+12,14,14,2); ctx.fill();
  ctx.strokeStyle='#5a3010'; ctx.lineWidth=1.2; ctx.strokeRect(x+12,y+12,14,14);
  ctx.beginPath(); ctx.moveTo(x+19,y+12); ctx.lineTo(x+19,y+26); ctx.stroke();
  ctx.fillStyle='#6ab0d0';
  ctx.beginPath(); ctx.roundRect(x+w-26,y+12,14,14,2); ctx.fill();
  ctx.strokeStyle='#5a3010'; ctx.lineWidth=1.2; ctx.strokeRect(x+w-26,y+12,14,14);
  ctx.beginPath(); ctx.moveTo(x+w-19,y+12); ctx.lineTo(x+w-19,y+26); ctx.stroke();
  // 標示
  ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🏠',x+w/2,y-4);
}

function drawBarracksBuilding(b){
  const {x,y,w,h}=b;
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h-4,w/2+4,5,0,0,Math.PI*2); ctx.fill();
  // 石牆
  ctx.fillStyle='#888'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#777'; ctx.fillRect(x,y,w,14);
  ctx.strokeStyle='#555'; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);
  // 石紋
  ctx.strokeStyle='rgba(0,0,0,.1)'; ctx.lineWidth=1;
  for(let i=0;i<5;i++){ const yy=y+18+i*12; ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); ctx.stroke(); }
  // 屋頂
  ctx.fillStyle='#4a3a2a';
  ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x+w/2,y-24); ctx.lineTo(x+w+4,y); ctx.closePath(); ctx.fill();
  // 旗幟
  ctx.strokeStyle='#888'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+w/2,y-24); ctx.lineTo(x+w/2,y-42); ctx.stroke();
  ctx.fillStyle='#c03030';
  ctx.beginPath(); ctx.moveTo(x+w/2,y-42); ctx.lineTo(x+w/2+16,y-37); ctx.lineTo(x+w/2,y-32); ctx.closePath(); ctx.fill();
  // 門
  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.roundRect(x+w/2-10,y+h-26,20,26,3); ctx.fill();
  ctx.fillStyle='#c8b040'; ctx.beginPath(); ctx.arc(x+w/2+3,y+h-13,2,0,Math.PI*2); ctx.fill();
  // 武器架
  ctx.fillStyle='#6a4020'; ctx.fillRect(x+8,y+14,7,16); ctx.fillRect(x+w-15,y+14,7,16);
  ctx.fillStyle='#a08060'; ctx.fillRect(x+9,y+14,5,3); ctx.fillRect(x+w-14,y+14,5,3);
  for(const yy of [16,20,24]){ ctx.fillStyle='#aaa'; ctx.fillRect(x+9,yy,5,1.5); ctx.fillRect(x+w-14,yy,5,1.5); }
  // 標示
  ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
  ctx.fillText('⚔️',x+w/2,y-4);
}

// ---- 主繪製 ----
function draw(){
  ctx.fillStyle='#3e8048'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.scale(cam.zoom,cam.zoom); ctx.translate(-cam.x,-cam.y);
  ctx.strokeStyle='rgba(0,0,0,.08)'; ctx.lineWidth=1;
  for(let x=0;x<=WORLD.w;x+=WORLD.tile){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke(); }
  for(let y=0;y<=WORLD.h;y+=WORLD.tile){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke(); }
  ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=6; ctx.strokeRect(0,0,WORLD.w,WORLD.h);
  for(const p of fx){
    ctx.fillStyle=`${p.color}${Math.floor(p.life*255).toString(16).padStart(2,'0')}`;
    ctx.beginPath(); ctx.arc(p.x,p.y,(p.size||3)*p.life,0,Math.PI*2); ctx.fill();
  }
  trees.forEach(drawTree);
  bushes.forEach(drawBush);
  buildings.forEach(drawBuilding); // 先畫建築再村民，讓村民顯示在建築前面
  drawTC();
  [...villagers].sort((a,b)=>a.y-b.y).forEach(drawVillager);
  if(boxSelecting&&boxRect){
    const x=Math.min(boxRect.x1,boxRect.x2), y=Math.min(boxRect.y1,boxRect.y2);
    const w=Math.abs(boxRect.x2-boxRect.x1), h=Math.abs(boxRect.y2-boxRect.y1);
    ctx.strokeStyle='rgba(100,255,100,.9)'; ctx.lineWidth=1.5/cam.zoom;
    ctx.fillStyle='rgba(100,255,100,.08)';
    ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h);
  }
  villagers.forEach(v=>{
    if(v.state==='gathering'&&v.targetRes){
      const t=v.targetRes;
      const pulse=Math.sin(performance.now()/200)*3;
      ctx.strokeStyle='rgba(255,200,50,.5)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(t.x,t.y,t.r+pulse,0,Math.PI*2); ctx.stroke();
    }
  });
  ctx.restore();
}

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
